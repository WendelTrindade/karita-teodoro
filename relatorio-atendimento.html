<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="author" content="Wendel Emílio de Souza Matias — oficial.respostas@gmail.com">
<link rel="manifest" href="painel.webmanifest">
<link rel="icon" type="image/png" href="icones/favicon-64.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel KT">
<title>Revitta Enfermagem 360° — Painel de Atendimento</title>
<style>
:root{
  --rosa:#EFE6D4; --rosa-medio:#E2D3B5; --rosa-esc:#8A6B32; --vinho:#292B2C; --rosa-claro:#F7F3EB; --rosa-bg:#FBF9F5;
  --ouro:#c9a227; --ouro-esc:#9c7a12; --ouro-claro:#f6e7b0;
  --texto:#2E3032; --cinza:#6F6A62; --borda:#E9E0CF; --branco:#fff;
  --sombra:0 4px 18px rgba(110,85,40,.10);
  --raio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--rosa-bg);color:var(--texto);font-size:15px;line-height:1.45;padding-bottom:84px}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font-family:inherit}
/* Cabeçalho */
.topo{background:linear-gradient(135deg,var(--rosa) 0%,var(--rosa-medio) 100%);color:var(--vinho);padding:16px 18px 14px;border-bottom:4px solid var(--ouro);box-shadow:var(--sombra);position:sticky;top:0;z-index:20}
.topo-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.topo .logo{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--ouro);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0}
.topo .logo img{width:100%;height:100%;object-fit:cover}
.topo h1{font-size:19px;letter-spacing:.3px}
.topo small{display:block;color:var(--ouro-esc);font-weight:600;font-size:12.5px;margin-top:2px}
.nav{max-width:1100px;margin:12px auto 0;display:flex;gap:6px}
.nav button{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);color:var(--vinho);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.nav button.ativo{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10;border-color:var(--ouro);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 14px}
/* Barra inferior (celular) */
.navbaixo{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ouro);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.navbaixo button{flex:1;background:none;border:none;color:var(--cinza);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.navbaixo button span{font-size:20px}
.navbaixo button.ativo{color:var(--rosa-esc);font-weight:700}
.navbaixo .mais span{background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));color:var(--vinho);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--ouro);margin-top:-22px;font-size:24px}
@media (max-width:720px){.nav{display:none}.navbaixo{display:flex}.topo h1{font-size:17px}}
/* Botões */
.btn{border:1px solid var(--borda);background:#fff;color:var(--rosa-esc);padding:9px 15px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--rosa)}
.btn.rosa{background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));color:var(--vinho);border-color:var(--rosa-medio)}
.btn.ouro{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10;border-color:var(--ouro-esc)}
.btn.perigo{color:#b3261e;border-color:#f3c4c0}
.btn.peq{padding:6px 10px;font-size:13px}
.btn.grande{padding:14px 20px;font-size:16px;width:100%;justify-content:center}
.btn-voz{margin-top:6px;border:1px dashed var(--ouro);background:#fffbea;color:var(--ouro-esc);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn-voz.gravando{background:#fdecea;color:#b3261e;border-color:#b3261e;animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.6}}
/* Cartões */
.cartao{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);border:1px solid var(--borda);padding:16px;margin-bottom:14px}
.cartao h2{font-size:18px;color:var(--rosa-esc);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cartao h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--ouro),transparent);margin-left:6px}
.titulo-pag{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.titulo-pag h2{font-size:22px;color:var(--rosa-esc)}
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:720px){.numeros{grid-template-columns:repeat(2,1fr)}}
.numero{background:#fff;border-radius:var(--raio);padding:14px;border:1px solid var(--borda);border-top:4px solid var(--ouro);box-shadow:var(--sombra)}
.numero b{display:block;font-size:28px;color:var(--rosa-esc);font-family:Georgia,serif}
.numero span{color:var(--cinza);font-size:13px}
/* Formulário */
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grade.g3{grid-template-columns:repeat(3,1fr)}
.grade.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:720px){.grade,.grade.g3{grid-template-columns:1fr}.grade.g4{grid-template-columns:repeat(2,1fr)}}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.full{grid-column:1/-1}
.campo>span{font-size:13px;font-weight:600;color:var(--rosa-esc)}
.req{color:#b3261e}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;font-size:15px;font-family:inherit;color:var(--texto);background:#fffefb}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(182,146,75,.18)}
textarea{resize:vertical;min-height:70px}
.busca{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.busca input,.busca select{flex:1;min-width:150px}
/* Listas */
.item{background:#fff;border:1px solid var(--borda);border-left:5px solid var(--rosa-medio);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(110,85,40,.06)}
.item-topo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.item h4{font-size:16px;color:var(--texto)}
.item .meta{color:var(--cinza);font-size:13px;margin-top:2px}
.item .prev{font-size:13.5px;margin-top:6px;color:#55534f}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.selo{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--rosa-claro);color:var(--rosa-esc);border:1px solid var(--borda);white-space:nowrap}
.selo.ouro{background:#fff6d6;color:var(--ouro-esc);border-color:var(--ouro-claro)}
.selo.verde{background:#e6f6ec;color:#1e7a3c;border-color:#bfe6cb}
.vazio{text-align:center;color:var(--cinza);padding:30px 10px}
.vazio .ico{font-size:42px;display:block;margin-bottom:6px}
.resumo-pac{background:var(--rosa-claro);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.alerta{background:#fff1f1;border:1px solid #f3c4c0;color:#9b1c1c;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:6px}
/* Fotos */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.foto{border:1px solid var(--borda);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.foto img{width:100%;height:140px;object-fit:cover;display:block;cursor:zoom-in}
.foto input{border:none;border-top:1px solid var(--borda);border-radius:0;font-size:13px;padding:8px}
.foto .rm{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--borda);border-radius:50%;width:30px;height:30px;cursor:pointer;color:#b3261e;font-weight:700}
.extra{border:1px dashed var(--ouro);border-radius:12px;padding:10px;margin-bottom:10px;background:#fffdf5}
/* Assinatura */
.assin{width:100%;height:150px;border:2px dashed var(--ouro);border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(41,43,44,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;border-top:5px solid var(--ouro);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-topo{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--borda)}
.modal-topo h3{color:var(--rosa-esc);font-size:18px}
.modal-topo .x{background:none;border:none;font-size:26px;color:var(--cinza);cursor:pointer;line-height:1}
.modal-corpo{padding:16px;overflow:auto}
.modal-acoes{padding:12px 16px;border-top:1px solid var(--borda);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.zoom{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 18px;border-radius:999px;z-index:200;font-size:14px;border:2px solid var(--ouro);box-shadow:var(--sombra)}
.rodape-app{text-align:center;color:var(--cinza);font-size:12px;padding:20px 10px 10px}
.rodape-app b{color:var(--ouro-esc)}
.salvar-fixo{position:sticky;bottom:78px;z-index:10;display:flex;gap:8px;background:rgba(255,247,250,.95);padding:10px;border-radius:14px;border:1px solid var(--borda);box-shadow:var(--sombra)}
@media (min-width:721px){.salvar-fixo{bottom:10px}}
/* Pacientes e financeiro */
.avatar{border-radius:50%;object-fit:cover;border:2px solid var(--ouro);background:linear-gradient(135deg,var(--rosa-claro),#fff);color:var(--rosa-esc);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Georgia,serif;flex-shrink:0}
.sub-form{grid-column:1/-1;margin:12px 0 0;font-size:15px;color:var(--rosa-esc);border-bottom:2px solid var(--ouro-claro);padding-bottom:4px;font-family:Georgia,serif}
.foto-pac{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--rosa-claro);border-radius:12px;padding:12px}
.resumo-pac .avatar{float:left;margin-right:10px}
.resumo-pac::after{content:"";display:block;clear:both}
.ficha-topo{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.ficha-topo h3{color:var(--rosa-esc);font-size:20px}
.ficha-dados{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px;font-size:14px}
.ficha-dados small{display:block;color:var(--ouro-esc);font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.ficha-dados .cheio{grid-column:1/-1}
.mini-num{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.mini-num div{background:#fff;border:1px solid var(--borda);border-top:3px solid var(--ouro);border-radius:10px;padding:8px;font-weight:700;color:var(--rosa-esc)}
.mini-num small{display:block;font-weight:400;color:var(--cinza);font-size:12px}
.mini-num .ok{color:#1e7a3c}.mini-num .atr{color:#b3261e}
.selo.vermelho{background:#fff1f1;color:#b3261e;border-color:#f3c4c0}
.item.desp{border-left-color:var(--ouro)}
.valor{font-weight:700;font-size:16px;font-family:Georgia,serif;white-space:nowrap}
.valor.pos{color:#1e7a3c}.valor.neg{color:#b3261e}
.barra-prog{height:6px;background:var(--rosa-claro);border-radius:99px;margin-top:8px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--ouro))}
.parc{display:flex;gap:10px;align-items:center;border:1px solid var(--borda);border-radius:10px;padding:9px 10px;margin-bottom:6px;background:#fff}
.parc.ok{background:#f1faf4;border-color:#bfe6cb}
.parc.atr{background:#fff1f1;border-color:#f3c4c0}
.pn{font-weight:700;color:var(--ouro-esc);min-width:40px}
.linha-parc{display:grid;grid-template-columns:36px 1fr 1fr auto 1fr;gap:8px;align-items:end;border-bottom:1px dashed var(--borda);padding:8px 0}
.linha-parc .pn{padding-bottom:10px}
.ck{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--rosa-esc);font-size:13.5px;padding-bottom:10px;cursor:pointer;white-space:nowrap}
.ck input{width:20px;height:20px;accent-color:var(--rosa)}
.numeros.g3{grid-template-columns:repeat(3,1fr)}
.numero.pos b{color:#1e7a3c}.numero.neg b{color:#b3261e}
.numero small{display:block;font-size:11.5px;color:var(--cinza);margin-top:2px}
.numero b{font-size:22px}
.barras .lin{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:7px}
.barras .tr{height:12px;background:var(--rosa-claro);border-radius:99px;overflow:hidden}
.barras .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--ouro));border-radius:99px}
.barras .vl{text-align:right;font-weight:700}
.modos{flex-wrap:wrap}
.engrenagem{margin-left:auto;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);color:var(--vinho);border-radius:50%;width:42px;height:42px;font-size:19px;cursor:pointer;flex-shrink:0}
.rec-valor{text-align:center;font-size:24px;font-weight:700;color:var(--rosa-esc);border:2px solid var(--ouro);border-radius:10px;padding:8px;margin:12px auto;max-width:260px;background:#fffbea;font-family:Georgia,serif}
.rec-txt{font-size:14px;line-height:1.9;text-align:justify}
.item-clin{border:1px solid var(--borda);border-left:4px solid var(--ouro);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fffdfb}
.item-clin-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--rosa-esc)}
.rel-chips{display:flex;flex-wrap:wrap;gap:6px}.rel-chips span{border:1px solid var(--borda);border-radius:20px;padding:3px 10px;font-size:11.5px;background:#fff}
.hist-clin{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--borda);font-size:13.5px;line-height:1.5}
.hc-data{min-width:48px;text-align:center;background:var(--rosa-claro);border-radius:10px;padding:4px 6px;color:var(--rosa-esc);line-height:1.1}
.hc-data small{display:block;font-size:10.5px;color:var(--cinza)}
.rel-tab{width:100%;border-collapse:collapse;margin:10px 0;font-size:11.5px}
.rel-tab th{background:var(--rosa-claro);color:var(--rosa-esc);text-align:left;padding:5px 6px;border-bottom:2px solid var(--ouro)}
.rel-tab td{padding:5px 6px;border-bottom:1px solid var(--borda)}
.rel-tab .dir{text-align:right}
.folha.curta{min-height:auto}
.rel-pac{display:flex;gap:12px;white-space:normal}
.rel-pac .rel-pares{flex:1}
.rel-foto{width:27mm;height:33mm;object-fit:cover;border:1.5px solid var(--ouro);border-radius:6px;flex-shrink:0}
@media (max-width:720px){
  .numeros.g3{grid-template-columns:repeat(2,1fr)}
  .ficha-dados{grid-template-columns:1fr}
  .linha-parc{grid-template-columns:30px 1fr 1fr}
  .linha-parc .ck{grid-column:2}
  .barras .lin{grid-template-columns:96px 1fr 88px;font-size:12.5px}
  .numero b{font-size:18px}
}
/* Blocos do cadastro */
.bloco-form{border:1px solid var(--borda);border-radius:14px;padding:12px 14px 14px;margin-bottom:12px;background:#fff}
.bloco-form>h4{margin:0 0 10px;font-size:15.5px;color:var(--rosa-esc);font-family:Georgia,serif}
.bloco-form.conv{border:2px solid var(--ouro);background:#fffcf0}
.bloco-form.saude{border:2px solid #f3a8a8;background:#fff6f6}
.bloco-form.saude>h4{color:#b3261e}
.bloco-form.emerg{border:2px solid var(--rosa);background:var(--rosa-claro)}
.aviso-ok{background:#e6f6ec;border:1px solid #bfe6cb;color:#1e7a3c;border-radius:10px;padding:8px 12px;font-size:14px}
.selo.conv{background:#fff6d6;color:var(--ouro-esc);border-color:var(--ouro-claro)}
.selo.sangue{background:#fff1f1;color:#b3261e;border-color:#f3c4c0}
.painel-emerg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pe-item{background:#fff;border:1.5px solid var(--borda);border-left:5px solid var(--ouro);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.pe-item small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ouro-esc);font-weight:700;margin-bottom:2px}
.pe-item.perigo{background:#fff1f1;border-color:#f3c4c0;border-left-color:#b3261e;color:#9b1c1c}
@media (max-width:720px){.painel-emerg{grid-template-columns:1fr}}
/* Visualizador */
.vz-fundo{position:fixed;inset:0;background:rgba(20,20,20,.97);z-index:400;display:flex;flex-direction:column}
.vz-topo{display:flex;gap:6px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-top) * 0);border-bottom:2px solid var(--ouro)}
.vz-cont{color:var(--rosa);font-weight:700;font-size:14px;padding-left:4px}
.vz-btn{background:rgba(239,230,212,.15);border:1px solid rgba(239,230,212,.45);color:#fff;border-radius:10px;min-width:44px;height:44px;font-size:19px;cursor:pointer;padding:0 8px;font-weight:700}
.vz-btn.fechar{background:var(--rosa);color:var(--vinho);border-color:var(--ouro)}
.vz-meio{flex:1;position:relative;min-height:0}
.vz-palco{position:absolute;inset:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.vz-palco img{max-width:100%;max-height:100%;transform-origin:center center;-webkit-user-drag:none;cursor:grab;will-change:transform}
.vz-palco video{max-width:100%;max-height:100%;background:#000}
.vz-carregando{color:#fff;font-size:15px}
.vz-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:62px;border-radius:12px;border:1px solid rgba(239,230,212,.5);background:rgba(0,0,0,.35);color:#fff;font-size:34px;cursor:pointer;z-index:2}
.vz-ant{left:8px}.vz-prox{right:8px}
.vz-leg{color:#fff;text-align:center;padding:8px 14px 4px;font-size:14.5px;min-height:20px}
.vz-dica{color:rgba(255,255,255,.55);text-align:center;font-size:11.5px;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.video-capa{position:relative;height:140px;background:#2f3133;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-capa video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.video-capa .play{position:relative;z-index:1;width:50px;height:50px;border-radius:50%;background:rgba(239,230,212,.95);color:var(--vinho);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--ouro);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.video-capa small{position:absolute;bottom:5px;right:6px;z-index:1;color:#fff;background:rgba(0,0,0,.6);padding:1px 7px;border-radius:6px;font-size:11px}
.video-capa.sumiu::after{content:"Vídeo não encontrado";position:absolute;bottom:26px;color:#fff;font-size:11px;z-index:1}
.foto img{cursor:zoom-in}
@media print{.so-tela{display:none!important}}
/* Tela de senha */
body.bloqueado>*:not(#telaBloqueio){display:none!important}
#telaBloqueio{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.55),transparent 50%),linear-gradient(135deg,var(--rosa),var(--rosa-medio))}
.bq-caixa{background:#fff;border-radius:24px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 30px 70px rgba(41,43,44,.3);border:2px solid #fff}
.bq-topo{text-align:center;padding:26px 22px 18px;background:var(--rosa-claro);border-bottom:4px solid var(--ouro)}
.bq-cad{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid var(--ouro);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.bq-cad img{width:100%;height:100%;object-fit:cover}
.bq-topo h2{color:var(--vinho);font-size:24px}
.bq-topo p{margin:4px 0 0;color:var(--rosa-esc);font-size:14px;font-weight:600}
.bq-corpo{padding:22px}
.bq-corpo label{display:block;font-weight:700;color:var(--rosa-esc);font-size:14px;margin-bottom:6px}
.bq-senha{position:relative}
.bq-senha input{padding:14px 48px 14px 14px;font-size:17px;border-radius:14px}
.bq-senha button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer}
.bq-erro{color:#b3261e;font-weight:600;font-size:14px;min-height:22px;margin:8px 0 6px}
.bq-voltar{display:block;text-align:center;margin-top:14px;color:var(--rosa-esc);font-weight:600;text-decoration:none;font-size:14px}
.engrenagem.sair{margin-left:6px}
/* Portal */
.codigo-grande{font-family:Georgia,serif;font-size:38px;letter-spacing:6px;text-align:center;font-weight:700;color:var(--vinho);background:#fffbea;border:2px dashed var(--ouro);border-radius:14px;padding:12px;margin:10px 0}
.portal-box{background:#fff;border:1.5px solid var(--borda);border-left:5px solid var(--ouro);border-radius:12px;padding:10px 12px;margin-top:6px}
.portal-cod small{display:block;font-size:11px;color:var(--ouro-esc);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.portal-cod b{font-family:Georgia,serif;font-size:22px;letter-spacing:3px;color:var(--vinho)}
@media (max-width:520px){.ag-linha>div:nth-child(2){display:none}.ag-selo .selo{white-space:normal;text-align:center}.ag-hora{min-width:64px;font-size:16px}}
/* Equipe */
.chip-usuario{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-size:13px;font-weight:700;color:var(--vinho);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);border-radius:12px;padding:4px 10px}
.chip-usuario:empty{display:none}
.chip-usuario small{font-weight:600;color:var(--ouro-esc);font-size:11px}
#btnAjustes{margin-left:6px}
.bq-dica{font-size:12px;color:var(--cinza);text-align:center;margin-top:12px}
.bq-corpo>input{padding:14px;font-size:17px;border-radius:14px}
@media (max-width:520px){.topo h1{font-size:15px}.topo small#topoSub{display:none}.chip-usuario{font-size:12px;padding:3px 8px}}
.msg-previa{white-space:pre-wrap;background:#e7f8ec;border:1px solid #bfe6cb;border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:13.5px;line-height:1.5;max-height:260px;overflow:auto;color:#20352a}
/* Alertas de vencimento */
.parc.v-vencido{background:#fde4e2;border-color:#e57373;border-left:5px solid #d32f2f}
.parc.v-hoje{background:#ffecd6;border-color:#f0a04b;border-left:5px solid #ef6c00}
.parc.v-breve{background:#fff5cc;border-color:#e6c200;border-left:5px solid #e0a800}
.parc.v-semana{background:#fffbea;border-color:#efdf9a;border-left:5px solid #e6cf6a}
.parc.v-futuro{background:#fff}
.parc.v-pago{background:#f1faf4;border-color:#bfe6cb;border-left:5px solid #2e7d32}
.parc.v-bloq{background:#fff1f1;border-color:#f3c4c0}
.selo.sv-vencido{background:#d32f2f;color:#fff;border-color:#b71c1c}
.selo.sv-hoje{background:#ef6c00;color:#fff;border-color:#e65100}
.selo.sv-breve{background:#ffd54f;color:#5d4300;border-color:#e0a800}
.selo.sv-semana{background:#fff3c4;color:#7a5c00;border-color:#efdf9a}
.selo.sv-futuro{background:#f4f2ee;color:#66625b;border-color:#e5e0d6}
.selo.sv-pago{background:#e6f6ec;color:#1e7a3c;border-color:#bfe6cb}
.item.iv-vencido{border-left-color:#d32f2f;background:#fffafa}
.item.iv-hoje{border-left-color:#ef6c00}
.item.iv-breve{border-left-color:#e0a800}
.cartao-alertas{border:2px solid #f3c4c0;background:#fffafa}
.alertas-tit{font-weight:700;color:var(--vinho);margin:4px 0 6px;font-size:14px}
.alertas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.alerta-box{border:none;border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px}
.alerta-box b{font-size:13.5px}.alerta-box span{font-size:16px;font-weight:700;font-family:Georgia,serif}
.av-vencido{background:#d32f2f;color:#fff}.av-hoje{background:#ef6c00;color:#fff}.av-breve{background:#ffd54f;color:#5d4300}
@media (max-width:520px){.alertas{grid-template-columns:1fr}}
.filtros-venc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros-venc button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:7px 12px;font-family:inherit;font-weight:600;color:var(--rosa-esc);cursor:pointer;font-size:13px}
.filtros-venc button.ativo{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10;border-color:var(--ouro)}
.badge{position:absolute;top:-6px;right:-12px;background:#d32f2f;color:#fff;font-style:normal;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;border:2px solid #fff;line-height:1.3}
.ico-nav{position:relative;display:inline-block}
.nav button{position:relative}.nav .badge{top:-6px;right:-4px}
/* Horários livres e bloqueios */
.dias-livres{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory}
.dia-chip{flex:0 0 auto;scroll-snap-align:start;min-width:78px;border:1.5px solid var(--borda);background:#fff;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:inherit;color:var(--vinho)}
.dia-chip b{font-size:16px;font-family:Georgia,serif}.dia-chip small{font-size:11px;color:var(--cinza)}
.dia-chip.sel{background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro)}
.dia-chip.cheio,.dia-chip.bloq{opacity:.55;cursor:not-allowed;background:#f6f3ec}
.dia-chip.bloq small{color:#b3261e}
.horas-livres{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hora-chip{border:1.5px solid var(--borda);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--vinho);font-family:inherit;min-width:70px}
.hora-chip.sel{background:linear-gradient(135deg,#D2B57A,var(--ouro));border-color:var(--ouro-esc);color:#3a2d10}
.aviso-bloq{background:#fff1f1;border:1px solid #f3c4c0;color:#9b1c1c;border-radius:10px;padding:8px 12px;font-size:13.5px;margin:6px 0;font-weight:600}
.ag-mini.bloq{background:#fff1f1;border-left-color:#d32f2f;color:#9b1c1c}
.ag-dia.bloq{background:#fff6f6}
.ag-cel.bloq{background:#fde4e2}.ag-cel.bloqp{background:linear-gradient(135deg,#fff 50%,#fde4e2 50%)}.ag-cel.fechado{background:#f5f3ef}
.linha-hor{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.linha-hor input{padding:7px 6px;font-size:13.5px}
.linha-hor.cab span{font-size:11.5px;font-weight:700;color:var(--ouro-esc)}
@media (max-width:520px){.linha-hor{grid-template-columns:1.2fr 1fr 1fr;}.linha-hor>*:nth-child(4),.linha-hor>*:nth-child(5){grid-column:auto}.linha-hor.cab{display:none}}
.selo.aguarda{background:#ffecd6;color:#b45309;border-color:#f0a04b}
.ag-linha.cancelado{opacity:.62;background:#f5f3ef}.ag-linha.cancelado .ag-info>b{text-decoration:line-through}
.ag-selo{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.acoes-ag{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tile-ag{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--borda);border-radius:16px;padding:12px 13px;background:#fff;cursor:pointer;font:inherit;color:var(--texto);min-height:84px;transition:transform .08s,box-shadow .15s}
.tile-ag:active{transform:scale(.97)}.tile-ag:hover{box-shadow:0 4px 14px rgba(150,80,100,.15)}
.tile-ag .tile-ico{font-size:22px;line-height:1}.tile-ag b{font-size:15px}.tile-ag small{font-size:12px;color:var(--cinza);line-height:1.25}
.tile-ag.rosa{border-color:var(--rosa-esc);background:linear-gradient(135deg,#fff,var(--rosa-claro))}
.tile-ag.ouro{border-color:var(--ouro);background:linear-gradient(135deg,#fff,#fbf3e2)}
.tile-ag.verde{border-color:#5fae7b;background:linear-gradient(135deg,#fff,#eaf7ee)}
.tile-ag.vermelho{border-color:#d9534f;background:linear-gradient(135deg,#fff,#fdecea)}
.tile-ag.cinza{background:#fbfaf8}
.chips-motivo{display:flex;flex-wrap:wrap;gap:8px}
.chip-mot{border:1.5px solid var(--borda);background:#fff;border-radius:22px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--texto)}
.chip-mot.sel{border-color:var(--rosa-esc);background:var(--rosa-claro);color:var(--rosa-esc);font-weight:700}
.hist-ag{margin-top:14px;border-top:1px dashed var(--borda);padding-top:8px}.hist-ag summary{cursor:pointer;font-weight:700;color:var(--rosa-esc);font-size:14px}
.hist-ag-li{padding:6px 0;border-bottom:1px solid #f1ebdf;font-size:13.5px}
.ag-linha.pendente{border:2px dashed #f0a04b;background:#fffaf3}
.ag-linha.pendente .ag-hora{background:linear-gradient(135deg,#ffd7a8,#f0a04b);color:#5a2c00}
.cartao-encaixe{border:2px solid #f0a04b;background:#fffaf3}
/* Faixa de teste */
.faixa-teste{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fffbea;border:2px dashed var(--ouro);border-radius:14px;padding:12px 14px;margin-bottom:14px;color:#6b4e06}
/* Agenda */
.ag-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-topo .rotulo{flex:1;text-align:center;font-family:Georgia,serif;font-size:17px;color:var(--rosa-esc);font-weight:700;min-width:150px}
.modos{display:flex;gap:4px;background:var(--rosa-claro);padding:4px;border-radius:999px}
.modos button{border:none;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--rosa-esc);font-weight:600;font-size:14px}
.modos button.ativo{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10}
.ag-linha{display:flex;gap:12px;align-items:stretch;background:#fff;border:1px solid var(--borda);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(110,85,40,.06)}
.ag-linha:hover{border-color:var(--rosa)}
.ag-hora{background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));color:var(--vinho);min-width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;border-right:3px solid var(--ouro);padding:8px 4px}
.ag-hora small{font-size:11px;font-weight:600;color:var(--ouro-esc)}
.ag-info{flex:1;padding:9px 0;min-width:0}
.ag-info b{display:block;font-size:15.5px}
.ag-selo{padding:8px 10px 8px 0;align-self:center}
.ag-linha.retorno .ag-hora{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10;border-right-color:var(--rosa)}
.ag-linha.retorno .ag-hora small{color:#6b4e06}
.ag-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.ag-dia{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:8px;min-height:130px;min-width:0}
.ag-dia.hoje{border:2px solid var(--ouro);background:#fffdf5}
.ag-dia h5{margin:0 0 6px;font-size:13px;color:var(--rosa-esc);cursor:pointer;border-bottom:1px solid var(--borda);padding-bottom:4px}
.ag-mini{font-size:12px;background:var(--rosa-claro);border-left:3px solid var(--rosa);border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-mini b{color:var(--rosa-esc)}
.ag-mini.retorno{background:#fff6d6;border-left-color:var(--ouro)}
.ag-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ag-mes .sem{text-align:center;font-size:11.5px;font-weight:700;color:var(--ouro-esc);padding:4px 0}
.ag-cel{background:#fff;border:1px solid var(--borda);border-radius:10px;min-height:66px;padding:5px;cursor:pointer;font-size:12px;min-width:0}
.ag-cel.fora{opacity:.4}
.ag-cel.hoje{border:2px solid var(--ouro)}
.ag-cel.sel{background:var(--rosa-claro);border-color:var(--rosa)}
.ag-cel .n{font-weight:700;color:var(--rosa-esc)}
.ag-cel .qtd{display:inline-block;margin:3px 2px 0 0;background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));color:var(--vinho);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
.ag-cel .qtd.r{background:linear-gradient(135deg,#D2B57A,var(--ouro));color:#3a2d10}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--cinza);margin-top:10px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.ag-semana{grid-template-columns:1fr}.ag-dia{min-height:auto}.ag-cel{min-height:54px;padding:3px}.ag-cel .qtd{padding:1px 5px}.navbaixo button{font-size:10.5px}}
/* Relatório */
#relatorioTela{position:fixed;inset:0;background:#efebe3;z-index:90;overflow:auto;padding-bottom:30px}
#relatorioTela .barra{position:sticky;top:0;background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--ouro);z-index:2}
.grow{flex:1}
.folha{background:#fff;width:210mm;max-width:calc(100% - 20px);min-height:297mm;margin:18px auto;padding:16mm 15mm;box-shadow:0 6px 24px rgba(0,0,0,.15);color:#262829;font-size:12.5px}
.rel-cab{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--ouro);padding-bottom:10px}
.rel-cab .rlogo{width:70px;height:70px;object-fit:contain;flex-shrink:0}
.rel-cab .rnome{flex:1}
.rel-cab h2{font-size:20px;color:var(--rosa-esc)}
.rel-cab .sub{color:var(--ouro-esc);font-weight:600;font-size:13px}
.rel-cab .ctt{font-size:11px;color:#66625b;margin-top:3px}
.rel-num{text-align:right;font-size:11.5px;border:1.5px solid var(--ouro);border-radius:8px;padding:6px 10px;background:#fffbea}
.rel-num b{display:block;font-size:15px;color:var(--rosa-esc)}
.rel-tit{text-align:center;margin:14px 0 6px;font-family:Georgia,serif;font-size:17px;letter-spacing:2px;color:var(--rosa-esc);font-weight:700}
.rel-tit::after{content:"";display:block;width:120px;height:2px;background:var(--ouro);margin:6px auto 0}
.rel-sec{margin-top:14px;page-break-inside:avoid;break-inside:avoid}
.rel-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--vinho);background:linear-gradient(90deg,var(--rosa),var(--rosa-medio));padding:5px 10px;border-radius:6px 6px 0 0;border-bottom:2px solid var(--ouro);font-family:inherit}
.rel-box{border:1px solid var(--borda);border-top:none;padding:9px 11px;border-radius:0 0 6px 6px;white-space:pre-wrap}
.rel-pares{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;white-space:normal}
.rel-pares div small{display:block;color:var(--ouro-esc);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rel-pares .l2{grid-column:span 2}.rel-pares .l3{grid-column:1/-1}
.rel-alerta{background:#fff1f1;border:1px solid #f3c4c0;color:#9b1c1c;padding:6px 10px;border-radius:6px;margin-top:8px;white-space:normal}
.rel-sinais{width:100%;border-collapse:collapse;text-align:center}
.rel-sinais th{font-size:10px;color:var(--ouro-esc);text-transform:uppercase;padding:4px;border-bottom:1px solid var(--borda)}
.rel-sinais td{padding:6px 4px;font-weight:600;font-size:13px}
.rel-fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;white-space:normal}
.rel-fotos figure{margin:0;border:1px solid var(--borda);border-radius:6px;overflow:hidden;page-break-inside:avoid;break-inside:avoid}
.rel-fotos img{width:100%;height:62mm;object-fit:cover;display:block}
.rel-fotos figcaption{font-size:11px;padding:5px 8px;background:#fffbea;border-top:1px solid var(--ouro-claro)}
.rel-assin{margin-top:30px;text-align:center;page-break-inside:avoid;break-inside:avoid}
.rel-assin img{height:70px;display:block;margin:0 auto -6px}
.rel-assin .linha{width:280px;max-width:80%;border-top:1.5px solid #262829;margin:0 auto;padding-top:4px;font-weight:700}
.rel-assin small{display:block;color:#66625b}
.rel-rod{margin-top:22px;border-top:2px solid var(--ouro);padding-top:6px;font-size:10px;color:#77726a;display:flex;justify-content:space-between;gap:10px}
@media (max-width:720px){.folha{padding:14px 12px;min-height:auto;font-size:12px}.rel-pares{grid-template-columns:1fr 1fr}.rel-fotos img{height:150px}}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;padding:0}
  body>*:not(#relatorioTela){display:none!important}
  #relatorioTela{position:static;background:#fff;overflow:visible;padding:0}
  #relatorioTela .barra{display:none}
  .folha{box-shadow:none;margin:0;width:auto;max-width:none;min-height:auto;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ===== Acabamento visual v2.5 ===== */
:root{--sombra:0 1px 2px rgba(41,43,44,.04),0 8px 24px rgba(110,85,40,.07);--raio:16px;--borda:#efe7d8}
body{background:#fbf8f2;padding-bottom:90px}
.topo{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--vinho);padding:0;border-bottom:1px solid var(--borda);box-shadow:0 2px 16px rgba(110,85,40,.08)}
.topo::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--rosa),var(--ouro),var(--rosa))}
.topo-in{max-width:1200px;margin:0 auto;height:64px;padding:0 18px;display:flex;align-items:center;gap:16px}
.marca-app{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0;max-width:260px}
.topo .logo{width:40px;height:40px;font-size:20px;border:2px solid var(--ouro);background:linear-gradient(135deg,var(--rosa-claro),#fff);box-shadow:0 2px 8px rgba(110,85,40,.15)}
.marca-txt{min-width:0}
.topo h1{font-size:18px;color:var(--vinho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.topo small#topoSub{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ouro-esc);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nav{margin:0 auto;padding:0;max-width:none;display:flex;gap:2px;align-items:center}
.nav button{position:relative;background:none;border:none;color:var(--rosa-esc);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;transition:.15s}
.nav button:hover{background:var(--rosa-claro);color:var(--vinho)}
.nav button.ativo{background:var(--rosa-claro);color:var(--vinho);box-shadow:inset 0 -2px 0 var(--ouro)}
.nav button.novo{background:linear-gradient(135deg,var(--rosa),var(--rosa-medio));color:var(--vinho);margin-left:4px}
.nav .badge{top:-2px;right:-2px}
.topo-dir{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}

/* ---------- Banco de dados (IndexedDB) ---------- */
const NOME_DB = 'relatorio_atendimento_paciente';
let db = null;
function abrirDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(NOME_DB, 5);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('pacientes')) d.createObjectStore('pacientes', {keyPath:'id'});
      if (!d.objectStoreNames.contains('atendimentos')) d.createObjectStore('atendimentos', {keyPath:'id'});
      if (!d.objectStoreNames.contains('financeiro')) d.createObjectStore('financeiro', {keyPath:'id'});
      if (!d.objectStoreNames.contains('midias')) d.createObjectStore('midias', {keyPath:'id'});
      ['usuarios', 'ponto', 'fotos', 'bloqueios'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:'id'}); });
      if (!d.objectStoreNames.contains('config')) d.createObjectStore('config', {keyPath:'chave'});
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function operar(store, modo, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, modo);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

function guardarSessaoNuvem(){ try { if (sessaoNuvem) sessionStorage.setItem('kt_nuvem', JSON.stringify(sessaoNuvem)); else sessionStorage.removeItem('kt_nuvem'); } catch (e) {} }
async function tokenSessao(){
  if (!sessaoNuvem) throw new Error('sessao');
  if (sessaoNuvem.idToken && Date.now() < sessaoNuvem.expira) return sessaoNuvem.idToken;
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(NUVEM.apiKey), {method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sessaoNuvem.refreshToken)});
  if (!r.ok) throw new Error('sessao');
  const j = await r.json();
  sessaoNuvem.idToken = j.id_token; sessaoNuvem.refreshToken = j.refresh_token || sessaoNuvem.refreshToken;
  sessaoNuvem.expira = Date.now() + (parseInt(j.expires_in, 10) - 120) * 1000;
  guardarSessaoNuvem();
  return sessaoNuvem.idToken;
}

}

/* ----- Firestore ----- */
const baseFs = () => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(NUVEM.projectId)}/databases/(default)/documents`;
function valorFs(v){
  if (v === null || v === undefined) return {nullValue:null};
  if (typeof v === 'boolean') return {booleanValue:v};
  if (typeof v === 'number') return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if (v instanceof Date) return {timestampValue:v.toISOString()};
  return {stringValue:String(v)};
}
function lerValorFs(v){
  if ('stringValue' in v) return v.stringValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
async function chamarFs(metodo, url, corpo){
  const r = await fetch(url, {method:metodo, headers:Object.assign({Authorization:'Bearer ' + await tokenSessao()}, corpo ? {'Content-Type':'application/json'} : {}), body: corpo ? JSON.stringify(corpo) : undefined});
  if (r.status === 404 && metodo !== 'POST') return null;
  if (!r.ok) throw new Error(r.status === 403 ? 'permissao' : r.status === 401 ? 'sessao' : 'rede');
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const camposFs = o => { const f = {}; for (const [k, v] of Object.entries(o)) f[k] = valorFs(v); return f; };
const lerDocFs = d => { const o = {}; for (const [k, v] of Object.entries((d && d.fields) || {})) o[k] = lerValorFs(v); if (d && d.name) o._id = d.name.split('/').pop(); return o; };
async function nuvemPut(col, id, campos, horaServidor){
  if (!horaServidor) { await chamarFs('PATCH', `${baseFs()}/${col}/${id}`, {fields:camposFs(campos)}); return; }
  const nome = `projects/${NUVEM.projectId}/databases/(default)/documents/${col}/${id}`;
  await chamarFs('POST', baseFs() + ':commit', {writes:[{update:{name:nome, fields:camposFs(campos)}, updateMask:{fieldPaths:Object.keys(campos)},
    updateTransforms:horaServidor.map(c => ({fieldPath:c, setToServerValue:'REQUEST_TIME'}))}]});
}
async function nuvemDel(col, id){ await chamarFs('DELETE', `${baseFs()}/${col}/${id}`); }
async function nuvemGet(col, id){ const d = await chamarFs('GET', `${baseFs()}/${col}/${id}`); return d ? lerDocFs(d) : null; }
async function nuvemListar(col, filtro){
  const docs = [];
  if (filtro) {
    const r = await chamarFs('POST', baseFs() + ':runQuery', {structuredQuery:{from:[{collectionId:col}],
      where:{fieldFilter:{field:{fieldPath:filtro[0]}, op:'EQUAL', value:valorFs(filtro[1])}}}});
    (r || []).forEach(x => { if (x.document) docs.push(x.document); });
  } else {
    let pag = '';
    do {
      const r = await chamarFs('GET', `${baseFs()}/${col}?pageSize=300` + (pag ? '&pageToken=' + encodeURIComponent(pag) : ''));
      ((r && r.documents) || []).forEach(d => docs.push(d));
      pag = r && r.nextPageToken;
    } while (pag);
  }
  return docs.map(lerDocFs);
}
const doJson = o => { try { return JSON.parse((o && o.json) || '{}'); } catch (e) { return {}; } };

/* ----- fotos guardadas à parte na nuvem (carregam só quando precisa) ----- */
const fotoCacheMem = new Map();
const fotosNuvem = new Map();
function listasFotos(store, o){
  if (store === 'pacientes') return [[o.docs, 'equipe']];
  if (store === 'atendimentos') return [[o.fotos, 'admin']];
  if (store === 'financeiro') return [[o.comprovantes, o.tipo === 'receita' ? 'equipe' : 'admin']];
  return [];
}
const semSrc = lista => (lista || []).map(f => { const c = Object.assign({}, f); delete c.src; return c; });
async function enviarFotos(store, o){
  const dono = store + ':' + o.id, atuais = new Set();
  for (const [lista, nivel] of listasFotos(store, o)) for (const f of (lista || [])) {
    if (!f.id) f.id = uid();
    atuais.add(f.id);
    if (f.src && !f.enviado) { await nuvemPut(COLECOES.arquivos, f.id, {src:f.src, nivel, dono}); f.enviado = true; fotoCacheMem.set(f.id, f.src); }
  }
  if (ehAdmin()) for (const id of (fotosNuvem.get(dono) || [])) if (!atuais.has(id)) { try { await nuvemDel(COLECOES.arquivos, id); } catch (e) {} }
  fotosNuvem.set(dono, atuais);
}
async function garantirSrc(f){
  if (!f || f.src || !emNuvem() || !f.id) return f;
  let src = fotoCacheMem.get(f.id);
  if (!src) { try { const r = await operar('fotos', 'readonly', st => st.get(f.id)); if (r) src = r.src; } catch (e) {} }
  if (!src) {
    try { const d = await nuvemGet(COLECOES.arquivos, f.id); if (d && d.src) { src = d.src; operar('fotos', 'readwrite', st => st.put({id:f.id, src})).catch(() => {}); } } catch (e) {}
  }
  if (src) { fotoCacheMem.set(f.id, src); f.src = src; }
  return f;
}
async function garantirFotos(...listas){
  const itens = listas.flat().filter(Boolean).filter(f => !f.src);
  if (!itens.length) return;
  toast('Carregando fotos...');
  await Promise.all(itens.map(garantirSrc));
}

/* ----- gravar / ler / apagar (decide sozinho: aparelho ou nuvem) ----- */
async function nuvemGravar(store, o){
  if (store === 'config') return gravarConfigNuvem(o);
  if (store === 'pacientes') {
    await enviarFotos(store, o);
    await nuvemPut(COLECOES.pacientes, o.id, {json:JSON.stringify(Object.assign({}, o, {docs:semSrc(o.docs)}))});
  } else if (store === 'atendimentos') {
    const ag = {}; CAMPOS_AGENDA.forEach(k => { if (o[k] !== undefined) ag[k] = o[k]; });
    await nuvemPut(COLECOES.agenda, o.id, {json:JSON.stringify(ag), data:o.data || ''});
    if (ehAdmin()) {
      await enviarFotos(store, o);
      const pr = {id:o.id};
      Object.keys(o).forEach(k => { if (!CAMPOS_AGENDA.includes(k)) pr[k] = o[k]; });
      pr.fotos = semSrc(o.fotos);
      await nuvemPut(COLECOES.prontuario, o.id, {json:JSON.stringify(pr)});
    }
  } else if (store === 'financeiro') {
    await enviarFotos(store, o);
    await nuvemPut(COLECOES.financeiro, o.id, {json:JSON.stringify(Object.assign({}, o, {comprovantes:semSrc(o.comprovantes)})), tipo:o.tipo});
  } else if (store === 'usuarios') {
    await nuvemPut(COLECOES.usuarios, o.id, {json:JSON.stringify(o), papel:o.papel || 'secretaria', ativo:o.ativo !== false});
  } else if (store === 'bloqueios') {
    await nuvemPut(COLECOES.bloqueios, o.id, {json:JSON.stringify(o)});
  } else if (store === 'ponto') {
    const campos = {json:JSON.stringify(o), uid:o.uid, saida:o.saida || ''};
    await nuvemPut(COLECOES.ponto, o.id, campos, o.saida ? ['horaServidorSaida'] : ['horaServidorEntrada']);
  }
}
async function nuvemApagar(store, id){
  if (['pacientes', 'financeiro', 'atendimentos'].includes(store)) {
    const dono = store + ':' + id;
    for (const fid of (fotosNuvem.get(dono) || [])) { try { await nuvemDel(COLECOES.arquivos, fid); } catch (e) {} }
    fotosNuvem.delete(dono);
  }
  if (store === 'atendimentos') { await nuvemDel(COLECOES.agenda, id); if (ehAdmin()) await nuvemDel(COLECOES.prontuario, id); return; }
  if (COLECOES[store]) await nuvemDel(COLECOES[store], id);
}
async function nuvemLerTodos(store){
  const adm = ehAdmin();
  const marcar = (st, o) => { const s = new Set(); for (const [l] of listasFotos(st, o)) (l || []).forEach(f => s.add(f.id)); fotosNuvem.set(st + ':' + o.id, s); return o; };
  if (store === 'pacientes') return (await nuvemListar(COLECOES.pacientes)).map(doJson).map(o => marcar(store, o));
  if (store === 'atendimentos') {
    const ag = (await nuvemListar(COLECOES.agenda)).map(doJson);
    if (adm) {
      const pr = new Map((await nuvemListar(COLECOES.prontuario)).map(x => [x._id, doJson(x)]));
      ag.forEach(a => { const p = pr.get(a.id); if (p) Object.keys(p).forEach(k => { if (!CAMPOS_AGENDA.includes(k)) a[k] = p[k]; }); marcar(store, a); });
    }
    return ag;
  }
  if (store === 'financeiro') return (await nuvemListar(COLECOES.financeiro, adm ? null : ['tipo', 'receita'])).map(doJson).map(o => marcar(store, o));
  if (store === 'usuarios') return adm ? (await nuvemListar(COLECOES.usuarios)).map(doJson) : [];
  if (store === 'bloqueios') return (await nuvemListar(COLECOES.bloqueios)).map(doJson);
  if (store === 'ponto') return (await nuvemListar(COLECOES.ponto, adm ? null : ['uid', sessaoNuvem.uid])).map(x => Object.assign(doJson(x), {servEntrada:x.horaServidorEntrada || '', servSaida:x.horaServidorSaida || ''}));
  return [];
}
async function gravarConfigNuvem(o){
  await idbGravar('config', Object.assign({}, o));
  await nuvemPut(COLECOES.contadores, 'geral', {json:JSON.stringify({contador:o.contador || 0, contadorRecibo:o.contadorRecibo || 0})});
  if (ehAdmin()) { const g = {}; CAMPOS_CONFIG_EQUIPE.forEach(k => { if (o[k] !== undefined) g[k] = o[k]; }); await nuvemPut(COLECOES.config, 'geral', {json:JSON.stringify(g)}); }
}
const naNuvem = s => emNuvem() && !SO_LOCAL.has(s) && s !== 'config';
async function lerTodos(s){ return naNuvem(s) ? nuvemLerTodos(s) : idbLerTodos(s); }
async function gravar(s, v){ return (emNuvem() && !SO_LOCAL.has(s)) ? nuvemGravar(s, v) : idbGravar(s, v); }
async function apagar(s, id){ return naNuvem(s) ? nuvemApagar(s, id) : idbApagar(s, id); }
async function esvaziar(s){
  if (naNuvem(s)) { for (const o of await nuvemLerTodos(s)) await nuvemApagar(s, o.id); return; }
  return idbEsvaziar(s);
}
async function proximoNumero(chave){
  if (emNuvem()) { try { const c = await nuvemGet(COLECOES.contadores, 'geral'); const v = c ? doJson(c) : {}; estado.config[chave] = Math.max(v[chave] || 0, estado.config[chave] || 0); } catch (e) {} }
  estado.config[chave] = (estado.config[chave] || 0) + 1;
  await salvarConfig();
  return estado.config[chave];
}

/* troca a marca antiga (Kárita Teodoro) pela Revitta Enfermagem 360°, uma única vez */
async function migrarMarcaRevitta(){
  const c = estado.config;
  if (c.marcaRevitta) return;
  if (!c.nome || /^(Kárita Teodoro|Clínica Rosa & Ouro)$/.test(c.nome)) c.nome = CONFIG_PADRAO.nome;
  if (!c.subtitulo || c.subtitulo === 'Atendimento ao paciente') c.subtitulo = CONFIG_PADRAO.subtitulo;
  ['endereco', 'telefone', 'profissional', 'local'].forEach(k => { if (!c[k]) c[k] = CONFIG_PADRAO[k]; });
  c.site = Object.assign({}, c.site || {});
  const sp = {especialidade:'Enfermagem especializada · Atendimento domiciliar', whatsapp:'(62) 99375-0975', instagram:'@revitta.enfermagem360',
    endereco:'Atendimento domiciliar no Estado de Goiás', horario:'Agendamentos mediante disponibilidade'};
  Object.keys(sp).forEach(k => { if (!c.site[k]) c.site[k] = sp[k]; });
  c.marcaRevitta = true;
  if (emNuvem() && !ehAdmin()) return;
  try { await gravar('config', c); } catch (e) { try { await idbGravar('config', c); } catch (e2) {} }
}
async function carregar(){
  const cfgLocal = (await idbLerTodos('config')).find(c => c.chave === 'geral') || {};
  estado.config = Object.assign(copia(CONFIG_PADRAO), cfgLocal);
  if (emNuvem()) {
    if (!estado.usuario) return;
    const g = await nuvemGet(COLECOES.config, 'geral'); if (g) Object.assign(estado.config, doJson(g));
  }
  await migrarMarcaRevitta();
  if (emNuvem()) {
    const ct = await nuvemGet(COLECOES.contadores, 'geral');
    if (ct) { const v = doJson(ct); estado.config.contador = v.contador || 0; estado.config.contadorRecibo = v.contadorRecibo || 0; }
  }
  estado.pacientes = await lerTodos('pacientes');
  estado.atendimentos = await lerTodos('atendimentos');
  estado.financeiro = await lerTodos('financeiro');
  estado.usuarios = await lerTodos('usuarios');
  estado.ponto = await lerTodos('ponto');
  estado.bloqueios = await lerTodos('bloqueios');
  estado.pacientes.forEach(migrarPaciente);
  ordenar();
}
function ordenar(){
  estado.pacientes.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  estado.atendimentos.sort((a, b) => ((b.data || '') + (b.hora || '')).localeCompare((a.data || '') + (a.hora || '')));
}
async function salvarConfig(){ await gravar('config', estado.config); atualizarTopo(); }

/* ---------- Janelas (modais próprios) ---------- */
function modal(titulo, corpo, botoes, largura){
  return new Promise(res => {
    const bg = h('div', {class:'modal-bg'});
    const fechar = v => { bg.remove(); res(v); };
    const caixa = h('div', {class:'modal', style: largura ? `max-width:${largura}px` : null},
      h('div', {class:'modal-topo'}, h('h3', null, titulo), h('button', {class:'x', title:'Fechar', onclick:() => fechar(null)}, '×')),
      h('div', {class:'modal-corpo'}, corpo),
      botoes && botoes.length ? h('div', {class:'modal-acoes'}, botoes.map(b =>
        h('button', {class:'btn ' + (b.classe || ''), onclick: async () => {
          if (b.antes) { const ok = await b.antes(); if (ok === false) return; }
          fechar(b.valor);
        }}, b.texto))) : null
    );
    bg.addEventListener('click', e => { if (e.target === bg) fechar(null); });
    bg.appendChild(caixa);
    document.body.appendChild(bg);
  });
}
const aviso = (msg, titulo) => modal(titulo || 'Aviso', h('p', null, msg), [{texto:'OK', valor:true, classe:'rosa'}]);
const confirmar = (msg, titulo, txt, perigo) => modal(titulo || 'Confirmar', h('p', null, msg),
  [{texto:'Cancelar', valor:false}, {texto:txt || 'Confirmar', valor:true, classe: perigo ? 'perigo' : 'rosa'}]);
/* ---------- Visualizador de fotos e vídeos (tela cheia, com zoom) ---------- */
function ampliarFoto(src, legenda, lista, indice){
  if (Array.isArray(lista) && lista.length) abrirVisualizador(lista.map(f => ({tipo:'foto', src:f.src, legenda:f.legenda})), indice || 0);
  else abrirVisualizador([{tipo:'foto', src, legenda}], 0);
}
const fmtTamanho = b => !b ? '' : b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const fmtDuracao = s => { if (!s || !isFinite(s)) return ''; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const lerMidia = id => operar('midias', 'readonly', st => st.get(id));

function abrirVisualizador(itens, inicio){
  let idx = inicio || 0, escala = 1, tx = 0, ty = 0, urlVideo = null, img = null;
  const ponteiros = new Map();
  let pinca = null, arrasto = null, ultimoToque = 0;

  const contador = h('span', {class:'vz-cont'});
  const btnMenos = h('button', {class:'vz-btn', title:'Diminuir zoom'}, '−');
  const btnMais = h('button', {class:'vz-btn', title:'Aumentar zoom'}, '+');
  const btnReset = h('button', {class:'vz-btn', title:'Tamanho original'}, '1:1');
  const btnBaixar = h('a', {class:'vz-btn', title:'Baixar', style:'text-decoration:none;display:inline-flex;align-items:center;justify-content:center'}, '⬇');
  const btnFechar = h('button', {class:'vz-btn fechar', title:'Fechar'}, '✕');
  const palco = h('div', {class:'vz-palco'});
  const legenda = h('div', {class:'vz-leg'});
  const btnAnt = h('button', {class:'vz-nav vz-ant', title:'Anterior'}, '‹');
  const btnProx = h('button', {class:'vz-nav vz-prox', title:'Próxima'}, '›');
  const dica = h('div', {class:'vz-dica'}, 'Use os botões + e −, a rodinha do mouse ou o movimento de pinça. Toque duas vezes para aproximar.');
  const fundo = h('div', {class:'vz-fundo'},
    h('div', {class:'vz-topo'}, contador, h('div', {class:'grow'}), btnMenos, btnMais, btnReset, btnBaixar, btnFechar),
    h('div', {class:'vz-meio'}, palco, btnAnt, btnProx),
    legenda, dica);

  const aplicar = () => {
    if (!img) return;
    if (escala <= 1.001) { escala = 1; tx = 0; ty = 0; }
    const r = palco.getBoundingClientRect();
    const limX = Math.max(0, (img.offsetWidth * escala - r.width) / 2 + 40);
    const limY = Math.max(0, (img.offsetHeight * escala - r.height) / 2 + 40);
    tx = Math.max(-limX, Math.min(limX, tx)); ty = Math.max(-limY, Math.min(limY, ty));
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${escala})`;
    btnReset.textContent = escala === 1 ? '1:1' : Math.round(escala * 100) + '%';
  };
  const zoomEm = (nova, cx, cy) => {
    nova = Math.max(1, Math.min(8, nova));
    const r = palco.getBoundingClientRect();
    const px = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2;
    const py = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    tx = px - (px - tx) * (nova / escala); ty = py - (py - ty) * (nova / escala);
    escala = nova; aplicar();
  };
  const liberarVideo = () => { if (urlVideo) { URL.revokeObjectURL(urlVideo); urlVideo = null; } };

  const mostrar = async () => {
    liberarVideo(); limpar(palco); img = null; escala = 1; tx = 0; ty = 0;
    const it = itens[idx];
    contador.textContent = itens.length > 1 ? `${idx + 1} de ${itens.length}` : (it.tipo === 'video' ? 'Vídeo' : 'Foto');
    legenda.textContent = it.legenda || '';
    btnAnt.style.display = btnProx.style.display = itens.length > 1 ? '' : 'none';
    const ehFoto = it.tipo !== 'video';
    [btnMenos, btnMais, btnReset].forEach(b => { b.style.display = ehFoto ? '' : 'none'; });
    dica.style.display = ehFoto ? '' : 'none';
    if (ehFoto) {
      img = h('img', {src:it.src, alt:'', draggable:'false'});
      palco.appendChild(img);
      btnBaixar.href = it.src; btnBaixar.setAttribute('download', 'foto.jpg');
      img.onload = aplicar;
    } else {
      palco.appendChild(h('div', {class:'vz-carregando'}, 'Carregando vídeo...'));
      let reg = null;
      try { reg = await lerMidia(it.midiaId); } catch (e) {}
      if (itens[idx] !== it) return;
      limpar(palco);
      if (!reg || !reg.blob) { palco.appendChild(h('div', {class:'vz-carregando'}, 'Vídeo não encontrado neste aparelho.')); btnBaixar.removeAttribute('href'); return; }
      urlVideo = URL.createObjectURL(reg.blob);
      palco.appendChild(h('video', {src:urlVideo, controls:true, autoplay:true, playsinline:true}));
      btnBaixar.href = urlVideo; btnBaixar.setAttribute('download', reg.nome || 'video.mp4');
    }
  };
  const ir_ = n => { idx = (idx + n + itens.length) % itens.length; mostrar(); };
  const fechar = () => { liberarVideo(); document.removeEventListener('keydown', teclado); fundo.remove(); };
  const teclado = e => {
    if (e.key === 'Escape') fechar();
    else if (e.key === 'ArrowRight' && itens.length > 1) ir_(1);
    else if (e.key === 'ArrowLeft' && itens.length > 1) ir_(-1);
    else if ((e.key === '+' || e.key === '=') && img) zoomEm(escala * 1.4);
    else if (e.key === '-' && img) zoomEm(escala / 1.4);
  };

  btnMais.addEventListener('click', () => zoomEm(escala * 1.5));
  btnMenos.addEventListener('click', () => zoomEm(escala / 1.5));
  btnReset.addEventListener('click', () => { escala = 1; aplicar(); });
  btnFechar.addEventListener('click', fechar);
  btnAnt.addEventListener('click', () => ir_(-1));
  btnProx.addEventListener('click', () => ir_(1));
  document.addEventListener('keydown', teclado);

  palco.addEventListener('wheel', e => { if (!img) return; e.preventDefault(); zoomEm(escala * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, {passive:false});
  palco.addEventListener('dblclick', e => { if (img) zoomEm(escala > 1 ? 1 : 2.5, e.clientX, e.clientY); });
  palco.addEventListener('pointerdown', e => {
    if (!img) return;
    ponteiros.set(e.pointerId, {x:e.clientX, y:e.clientY});
    palco.setPointerCapture && palco.setPointerCapture(e.pointerId);
    if (ponteiros.size === 2) {
      const [a, b] = [...ponteiros.values()];
      pinca = {d:Math.hypot(a.x - b.x, a.y - b.y), escala, cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2};
      arrasto = null;
    } else if (ponteiros.size === 1) {
      arrasto = {x:e.clientX, y:e.clientY, tx, ty, inicioX:e.clientX};
      if (e.pointerType === 'touch') {
        const agora = Date.now();
        if (agora - ultimoToque < 300) { zoomEm(escala > 1 ? 1 : 2.5, e.clientX, e.clientY); arrasto = null; }
        ultimoToque = agora;
      }
    }
  });
  palco.addEventListener('pointermove', e => {
    if (!ponteiros.has(e.pointerId)) return;
    ponteiros.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pinca && ponteiros.size === 2) {
      const [a, b] = [...ponteiros.values()];
      zoomEm(pinca.escala * Math.hypot(a.x - b.x, a.y - b.y) / pinca.d, pinca.cx, pinca.cy);
    } else if (arrasto && escala > 1) {
      tx = arrasto.tx + (e.clientX - arrasto.x); ty = arrasto.ty + (e.clientY - arrasto.y); aplicar();
    }
  });
  const soltar = e => {
    if (arrasto && escala === 1 && itens.length > 1 && ponteiros.size === 1) {
      const dx = e.clientX - arrasto.inicioX;
      if (Math.abs(dx) > 60) ir_(dx < 0 ? 1 : -1);
    }
    ponteiros.delete(e.pointerId);
    if (ponteiros.size < 2) pinca = null;
    if (!ponteiros.size) arrasto = null;
  };
  palco.addEventListener('pointerup', soltar);
  palco.addEventListener('pointercancel', soltar);

  document.body.appendChild(fundo);
  mostrar();
}

function duracaoVideo(arquivo){
  return new Promise(res => {
    try {
      const v = document.createElement('video');
      const url = URL.createObjectURL(arquivo);
      const fim = d => { URL.revokeObjectURL(url); res(d || 0); };
      v.preload = 'metadata';
      v.onloadedmetadata = () => fim(v.duration);
      v.onerror = () => fim(0);
      setTimeout(() => fim(0), 5000);
      v.src = url;
    } catch (e) { res(0); }
  });
}

/* ---------- Ditado por voz ---------- */
const Reconhecedor = window.SpeechRecognition || window.webkitSpeechRecognition;
function botaoDitar(campoTexto, obj, chave){
  let rec = null;
  const b = h('button', {type:'button', class:'btn-voz'}, '🎤 Ditar');
  b.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new Reconhecedor();
      rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = false;
      rec.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            const t = e.results[i][0].transcript.trim();
            campoTexto.value = (campoTexto.value ? campoTexto.value.replace(/\s*$/, ' ') : '') + t;
            obj[chave] = campoTexto.value;
          }
        }
      };
      rec.onend = () => { rec = null; b.classList.remove('gravando'); b.textContent = '🎤 Ditar'; };
      rec.onerror = ev => { if (ev.error === 'not-allowed') toast('Permita o uso do microfone'); };
      rec.start();
      b.classList.add('gravando'); b.textContent = '⏹ Parar de ditar';
    } catch (err) { rec = null; toast('Ditado indisponível neste navegador'); }
  });
  return b;
}

/* ---------- Campo de formulário ---------- */
function campo(obj, chave, rotulo, op = {}){
  const tipo = op.tipo || 'text';
  let inp;
  if (tipo === 'textarea') {
    inp = h('textarea', {rows: op.linhas || 3, placeholder: op.dica || ''});
    inp.value = obj[chave] || '';
  } else if (tipo === 'select') {

    inp.value = obj[chave] || (op.opcoes || [''])[0];
    obj[chave] = inp.value;
  } else {
    inp = h('input', {type:tipo, placeholder: op.dica || '', inputmode: op.im || null, step: op.passo || null});
    inp.value = obj[chave] || '';
  }
  const atualizar = () => { obj[chave] = inp.value; if (op.aoMudar) op.aoMudar(inp.value); };
  inp.addEventListener('input', atualizar);
  inp.addEventListener('change', atualizar);
  return h('div', {class:'campo' + (op.cheio ? ' full' : '')},
    h('span', null, rotulo, op.obrig ? h('b', {class:'req'}, ' *') : null),
    inp,
    (tipo === 'textarea' && Reconhecedor) ? botaoDitar(inp, obj, chave) : null
  );
}

/* ---------- Fotos ---------- */
function comprimirImagem(arquivo, max = 1400, qualidade = 0.82){
  return new Promise((res, rej) => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, a = img.height;
        const esc = Math.min(1, max / Math.max(w, a));
        w = Math.round(w * esc); a = Math.round(a * esc);
        const c = document.createElement('canvas');
        c.width = w; c.height = a;
        c.getContext('2d').drawImage(img, 0, 0, w, a);
        res(c.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = rej;
      img.src = leitor.result;
    };
    leitor.onerror = rej;
    leitor.readAsDataURL(arquivo);
  });
}

function avatar(p, tam){
  tam = tam || 44;
  const st = `width:${tam}px;height:${tam}px;min-width:${tam}px`;
  if (p && p.foto) return h('img', {class:'avatar', src:p.foto, style:st, alt:''});
  const ini = ((p && p.nome) || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  return h('div', {class:'avatar', style:st + `;font-size:${Math.round(tam * 0.38)}px`}, ini || '?');
}
const CONVENIOS = ['Particular','SUS','Unimed','IPASGO','Bradesco Saúde','SulAmérica','Amil','Hapvida','Porto Saúde','Cassi','Geap','Outro convênio'];
function textoConvenio(p){
  if (!p || !p.convenio) return '';
  return p.convenio === 'Outro convênio' ? (p.convenioOutro || 'Outro convênio') : p.convenio;
}
function detalheConvenio(p){
  const nome = textoConvenio(p);
  if (!nome) return '';
  if (p.convenio === 'SUS') return ['SUS', p.sus ? 'Cartão Nº ' + p.sus : '', p.ubs ? 'Unidade: ' + p.ubs : ''].filter(Boolean).join(' · ');
  if (p.convenio === 'Particular') return 'Particular';
  return [nome, p.plano, p.carteirinha ? 'Carteirinha Nº ' + p.carteirinha : '', p.validadeConvenio ? 'válida até ' + fmtData(p.validadeConvenio) : '',
    p.titularidade === 'Dependente' ? 'Dependente de ' + (p.nomeTitular || '—') : p.titularidade].filter(Boolean).join(' · ');
}
function textoAlergia(p){
  if (p.alergias) return p.alergias;
  return p.temAlergia === 'Não' ? 'Não possui alergias conhecidas' : 'Não informado';
}
function painelEmergencia(p){
  const tel = (p.telResponsavel || '').replace(/[^0-9+]/g, '');
  const tel2 = (p.telResponsavel2 || '').replace(/[^0-9+]/g, '');
  return h('div', {class:'painel-emerg'},
    h('div', {class:'pe-item' + (p.alergias ? ' perigo' : '')}, h('small', null, '⚠️ Alergias'), textoAlergia(p)),

    h('div', {class:'pe-item'}, h('small', null, '🏥 Convênio'), detalheConvenio(p) || 'Não informado'),
    h('div', {class:'pe-item'}, h('small', null, '🆘 Contato de emergência'),
      p.responsavel || p.telResponsavel ? [p.responsavel || '', p.parentesco ? ` (${p.parentesco})` : '', p.telResponsavel ? h('div', null, p.telResponsavel) : null, p.telResponsavel2 ? h('div', null, p.telResponsavel2) : null] : 'Não informado',
      tel ? h('a', {class:'btn rosa peq', href:'tel:' + tel, style:'margin-top:6px;text-decoration:none'}, '📞 Ligar') : null,
      tel2 ? h('a', {class:'btn peq', href:'tel:' + tel2, style:'margin-top:6px;margin-left:4px;text-decoration:none'}, '📞 Ligar 2º') : null));
}
function migrarPaciente(p){
  if (p.documento && !p.cpf) p.cpf = p.documento;
  if (p.convenio && !CONVENIOS.includes(p.convenio)) {
    const achou = CONVENIOS.find(c => c.toLowerCase() === String(p.convenio).trim().toLowerCase());
    if (achou) p.convenio = achou; else { p.convenioOutro = p.convenio; p.convenio = 'Outro convênio'; }
  }
  if (p.alergias && !p.temAlergia) p.temAlergia = 'Sim';
  if (p.endereco && !p.rua) p.rua = p.endereco;
  if (!Array.isArray(p.docs)) p.docs = [];
  if (!Array.isArray(p.videos)) p.videos = [];
  return p;
}
function enderecoCompleto(p){
  const l1 = [p.rua, p.numero].filter(Boolean).join(', ');
  const cid = [p.cidade, p.uf].filter(Boolean).join(' - ');
  return [l1, p.complemento, p.bairro, cid, p.cep ? 'CEP ' + p.cep : ''].filter(Boolean).join(' · ') || p.endereco || '';
}

function editorImagens(lista, vazio){
  const grade = h('div', {class:'fotos'});
  const desenhar = () => {
    limpar(grade);
    if (!lista.length) grade.appendChild(h('div', {class:'meta', style:'grid-column:1/-1;color:var(--cinza)'}, vazio || 'Nenhuma imagem.'));
    lista.forEach((f, i) => {

      leg.addEventListener('input', () => { f.legenda = leg.value; });
      grade.appendChild(h('div', {class:'foto'},
        h('img', {src:f.src, alt:'', onclick:() => ampliarFoto(f.src, f.legenda, lista, i)}),
        h('button', {class:'rm', type:'button', title:'Remover', onclick:() => { lista.splice(i, 1); desenhar(); }}, '×'),
        leg));
    });

      try { lista.push({id:uid(), src: await comprimirImagem(a), legenda:''}); }

      h('button', {class:'btn ouro peq', type:'button', onclick:() => cam.click()}, '📸 Fotografar'),

async function excluirPaciente(id){
  const p = pacientePorId(id);
  const ats = estado.atendimentos.filter(a => a.pacienteId === id);
  const fins = estado.financeiro.filter(l => l.pacienteId === id);
  const extras = [ats.length ? `${ats.length} atendimento(s)` : '', fins.length ? `${fins.length} lançamento(s) financeiro(s)` : ''].filter(Boolean).join(' e ');
  const msg = `Excluir ${p.nome}?` + (extras ? ` Também serão apagados ${extras} deste paciente.` : '') + ' Essa ação não pode ser desfeita.';
  if (!await confirmar(msg, 'Excluir paciente', 'Excluir', true)) return;
  for (const a of ats) await apagar('atendimentos', a.id);
  for (const l of fins) await apagar('financeiro', l.id);
  try {
    for (const a of ats) if (a.portal && a.portal.docId) await portalApagarDoc(PORTAL_COL_LAUDO, a.portal.docId);
    if (p.portalIndiceId) await portalApagarDoc(PORTAL_COL_IDX, p.portalIndiceId);
  } catch (e) {}
  await apagar('pacientes', id);
  estado.atendimentos = estado.atendimentos.filter(a => a.pacienteId !== id);
  estado.financeiro = estado.financeiro.filter(l => l.pacienteId !== id);
  estado.pacientes = estado.pacientes.filter(x => x.id !== id);
  limparVideosSoltos();
  toast('Paciente excluído');
  ir('pacientes');
}

function nomesUsados(campoLista, chave){
  const s = new Set();
  estado.atendimentos.forEach(a => (a[campoLista] || []).forEach(x => { if (x[chave]) s.add(x[chave]); }));
  return [...s].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
function datalist(id, itens){ return h('datalist', {id}, [...new Set(itens)].map(v => h('option', {value:v}))); }
function alergiaConflito(p, nomeMed){
  if (!p || !p.alergias || !nomeMed) return '';
  const al = p.alergias.toLowerCase(), n = nomeMed.toLowerCase().trim();
  if (n.length < 3) return '';
  const partes = al.split(/[,;\/\n]| e /).map(x => x.trim()).filter(x => x.length >= 3);
  const bate = partes.find(x => n.includes(x) || x.includes(n));
  return bate ? p.alergias : '';
}

}

  };

async function editarAtendimento(id, pre){
  if (!ehAdmin()) { editarAgendamento(id, pre); return; }
  const orig = id ? estado.atendimentos.find(a => a.id === id) : null;
  if (orig) await garantirFotos(orig.fotos);
  const at = orig ? copia(orig) : novoAtendimento(pre);
  if (estado.tela !== 'form') estado.voltar = estado.tela === 'inicio' || estado.tela === 'agenda' || estado.tela === 'pacientes' ? estado.tela : 'atendimentos';
  estado.tela = 'form';
  montarMenus();
  const area = $('#conteudo'); limpar(area); window.scrollTo(0, 0);

  area.appendChild(h('div', {class:'titulo-pag'},
    h('h2', null, orig ? `✏️ Editar atendimento Nº ${orig.numero}` : '＋ Novo atendimento'),
    h('button', {class:'btn', onclick:() => ir(estado.voltar)}, '← Voltar')));

  /* Paciente */
  const selPac = h('select');
  const resumo = h('div');
  const montarSelect = () => {
    limpar(selPac);
    selPac.appendChild(h('option', {value:''}, '— Selecione o paciente —'));
    estado.pacientes.forEach(p => selPac.appendChild(h('option', {value:p.id}, p.nome)));
    selPac.value = at.pacienteId || '';
    mostrarResumo();
  };
  const mostrarResumo = () => {
    limpar(resumo);
    const p = pacientePorId(at.pacienteId);
    if (!p) return;
    resumo.appendChild(h('div', {class:'resumo-pac'}, avatar(p, 52),
      [idade(p.nascimento), p.sexo, p.telefone, textoConvenio(p) ? '🏥 ' + textoConvenio(p) : '', p.tipoSanguineo ? '🩸 ' + p.tipoSanguineo : ''].filter(Boolean).join(' · ') || 'Sem dados adicionais',
      (p.responsavel || p.telResponsavel) ? h('div', null, h('b', null, '🆘 Emergência: '), [p.responsavel, p.parentesco, p.telResponsavel].filter(Boolean).join(' · ')) : null,
      p.historico ? h('div', null, h('b', null, 'Histórico: '), p.historico) : null,
      p.medicacoesUso ? h('div', null, h('b', null, 'Medicações em uso: '), p.medicacoesUso) : null));
    if (p.alergias) resumo.appendChild(h('div', {class:'alerta'}, '⚠️ Alergias: ' + p.alergias));
  };

function padAssinatura(obj){
  const cv = h('canvas', {class:'assin'});
  const ctx = cv.getContext ? cv.getContext('2d') : null;
  let desenhando = false, ultimo = null;
  const ajustar = () => {
    if (!ctx) return;
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const d = window.devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#262829';
    if (obj.assinatura) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = obj.assinatura; }
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  cv.addEventListener('pointerdown', e => { if (!ctx) return; desenhando = true; ultimo = pos(e); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!desenhando) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo = p;
  });
  const fim = () => { if (desenhando) { desenhando = false; obj.assinatura = cv.toDataURL('image/png'); } };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointerleave', fim); cv.addEventListener('pointercancel', fim);
  setTimeout(ajustar, 60);
  return h('div', null, cv, h('div', {class:'acoes'},
    h('button', {class:'btn peq', type:'button', onclick:() => {
      if (ctx) { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); }
      obj.assinatura = '';
    }}, '🧽 Limpar assinatura')));
}

async function salvarAtendimento(at, existente, abrir){
  if (!at.pacienteId) { await aviso('Selecione ou cadastre o paciente antes de salvar.'); return; }
  if (!at.data) { await aviso('Informe a data do atendimento.'); return; }
  const pacPortal = pacientePorId(at.pacienteId) || {};
  if (at.portal && at.portal.liberado) {
    if (!at.portal.validade) { await aviso('Escolha até quando o laudo fica disponível para o paciente.', 'Portal do paciente'); return; }
    if (!cpfValido(pacPortal.cpf)) { await aviso(erroPortal({message:'cpf'}) + ' Ou mude "Liberar este laudo" para Não.', 'Portal do paciente'); return; }
  }
  if (!existente || !at.numero) at.numero = formatarNumero(await proximoNumero('contador'), at.data);
  at.atualizadoEm = Date.now();
  try { await gravar('atendimentos', at); }
  catch (e) { await aviso('Não foi possível salvar. O armazenamento do aparelho pode estar cheio. Tente remover algumas fotos.', 'Erro ao salvar'); return; }
  const i = estado.atendimentos.findIndex(x => x.id === at.id);
  if (i < 0) {
    for (const ag of estado.atendimentos.filter(x => x.id !== at.id && x.pacienteId === at.pacienteId && x.data === at.data && (x.status === 'Agendado' || x.status === ST_FALTA))) {
      if (ag.status === ST_FALTA) { try { await desfazerFalta(ag.id); } catch (e) {} }
      ag.status = 'Concluído'; ag.obsAgenda = ((ag.obsAgenda || '') + ' (atendido — relatório registrado)').trim(); ag.atualizadoEm = Date.now();
      try { await gravar('atendimentos', ag); } catch (e) {}
    }
  }
  if (i >= 0) estado.atendimentos[i] = at; else estado.atendimentos.push(at);
  limparVideosSoltos();
  ordenar();
  toast('Atendimento salvo · Nº ' + at.numero);
  ir(estado.voltar || 'atendimentos');
  if (abrir) abrirRelatorio(at.id);
  if (at.portal && (at.portal.liberado || at.portal.docId)) {
    const tinhaCodigo = !!pacPortal.codigoPortal;
    const n = await publicarComAviso(at.pacienteId);
    if (n >= 0 && at.portal.liberado) {
      if (!tinhaCodigo) mostrarCodigoPortal(at.pacienteId, '✅ Laudo liberado no portal');
      else toast('Laudo disponível no portal até ' + fmtData(at.portal.validade));
    }
  }
}
async function excluirAtendimento(id){
  const a = estado.atendimentos.find(x => x.id === id);
  if (!await confirmar(`Excluir o atendimento Nº ${a.numero}? Essa ação não pode ser desfeita.`, 'Excluir atendimento', 'Excluir', true)) return;
  await apagar('atendimentos', id);
  limparVideosSoltos();
  estado.atendimentos = estado.atendimentos.filter(x => x.id !== id);
  if (a.portal && a.portal.docId) { try { await portalApagarDoc(PORTAL_COL_LAUDO, a.portal.docId); await publicarPaciente(a.pacienteId); } catch (e) {} }
  toast('Atendimento excluído');
  ir(estado.tela === 'form' ? 'atendimentos' : estado.tela);
}
async function duplicarAtendimento(id){
  const a = estado.atendimentos.find(x => x.id === id);
  if (!await confirmar('Criar um novo atendimento usando este como modelo? Data, hora, fotos e assinatura não serão copiadas.', 'Duplicar atendimento', 'Duplicar')) return;
  const n = copia(a);
  Object.assign(n, {id:uid(), numero:'', data:hojeISO(), hora:agoraHora(), horaFim:'', fotos:[], videos:[], portal:{liberado:false, validade:''}, assinatura:'', criadoEm:Date.now()});
  estado.atendimentos.push(n); // temporário para abrir no formulário
  editarAtendimento(n.id);
  estado.atendimentos = estado.atendimentos.filter(x => x.id !== n.id);
}
