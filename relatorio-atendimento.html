const DIAS_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGO = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataDe(iso){ const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d, 12); }
function somarDias(iso, n){ const d = dataDe(iso); d.setDate(d.getDate() + n); return isoDe(d); }
function eventosDoDia(iso){
  const ats = estado.atendimentos.filter(a => a.data === iso)
    .sort((x, y) => (x.hora || '99').localeCompare(y.hora || '99'))
    .map(a => ({retorno:false, at:a}));
  const rets = estado.atendimentos.filter(a => a.retorno === iso && a.status !== 'Cancelado' &&
      !estado.atendimentos.some(b => b.id !== a.id && b.pacienteId === a.pacienteId && b.data === iso))
    .map(a => ({retorno:true, at:a}));
  return ats.concat(rets);
}
function linhaAgenda(ev){
  const a = ev.at, p = pacientePorId(a.pacienteId) || {};
  return h('div', {class:'ag-linha' + (ev.retorno ? ' retorno' : '') + (!ev.retorno && a.status === 'Aguardando autorização' ? ' pendente' : '') + (!ev.retorno && a.status === 'Cancelado' ? ' cancelado' : ''), onclick:() => acoesAgenda(a, ev.retorno)},
    h('div', {class:'ag-hora'}, ev.retorno ? '↩' : (a.hora || '--:--'),
      h('small', null, ev.retorno ? 'Retorno' : (a.horaFim ? 'até ' + a.horaFim : ''))),
    h('div', {style:'align-self:center'}, avatar(p, 42)),
    h('div', {class:'ag-info'},
      h('b', null, p.nome || '(paciente removido)'),
      h('div', {class:'meta'}, ev.retorno ? `Retorno do atendimento Nº ${a.numero} (${fmtData(a.data)})` : [a.tipo, a.profissional].filter(Boolean).join(' · ')),
      p.telefone ? h('div', {class:'meta'}, '📞 ' + p.telefone) : null,
      (!ev.retorno && a.queixa && ehAdmin()) ? h('div', {class:'prev'}, a.queixa.length > 90 ? a.queixa.slice(0, 90) + '…' : a.queixa) : null,
      (!ev.retorno && a.obsAgenda) ? h('div', {class:'meta'}, '📝 ' + a.obsAgenda) : null),
    h('div', {class:'ag-selo'}, ev.retorno ? h('span', {class:'selo ouro'}, 'Retorno') : [seloStatus(a.status), seloConfirmacao(a)]));
}
/* =========================================================
   AGENDA: remarcar, cancelar e confirmar — do jeito fácil
   ========================================================= */
const MOTIVOS_REMARCAR = ['Paciente pediu para mudar', 'Paciente não pode comparecer', 'Paciente está doente', 'Kárita precisou mudar', 'Imprevisto de horário', 'Outro motivo'];
const MOTIVOS_CANCELAR = ['Paciente avisou que não vem', 'Paciente desistiu', 'Paciente está doente', 'Kárita / Revitta cancelou', 'Agendado por engano', 'Outro motivo'];
const primeiroNome = n => String(n || '').trim().split(/\s+/)[0] || '';
const quandoTxt = (data, hora) => `${DIAS_LONGO[dataDe(data).getDay()]}, ${fmtData(data)}${hora ? ' às ' + hora : ''}`;
function abrirWhatsPaciente(p, msg){
  const n = soDigitos(p && p.telefone);
  if (!n) { aviso('Este paciente não tem telefone cadastrado. Cadastre o telefone na ficha dele para enviar mensagens.', 'WhatsApp'); return; }
  window.open('https://wa.me/' + (n.length <= 11 ? '55' + n : n) + '?text=' + encodeURIComponent(msg), '_blank');
}
function msgAgenda(tipo, a, p, extra){
  const cli = estado.config.nome || 'Revitta Enfermagem 360°', nome = primeiroNome(p.nome);
  if (tipo === 'confirmar') return `Olá, ${nome}! 😊 Aqui é da ${cli}.\n\nPassando para lembrar do seu atendimento:\n📅 *${quandoTxt(a.data, a.hora)}*\n\nPode responder *SIM* para confirmar? Se não puder vir, é só avisar que a gente remarca. Obrigada!`;
  if (tipo === 'remarcado') return `Olá, ${nome}! Aqui é da ${cli}.\n\nSeu atendimento foi *remarcado* ✅\n${extra ? '❌ Antes: ' + extra + '\n' : ''}📅 *Novo horário: ${quandoTxt(a.data, a.hora)}*\n\nSe não puder comparecer, por favor nos avise por aqui. Obrigada!`;
  if (tipo === 'cancelado') return `Olá, ${nome}. Aqui é da ${cli}.\n\nSeu atendimento de *${quandoTxt(a.data, a.hora)}* foi *cancelado*.${extra ? '\nMotivo: ' + extra : ''}\n\nQuando quiser marcar um novo horário, é só responder esta mensagem. 💗`;
  return '';
}
function anotarHistorico(a, acao, detalhe){
  if (!Array.isArray(a.historico)) a.historico = [];
  a.historico.push({em:new Date().toISOString(), por:estado.usuario ? estado.usuario.nome : '', acao, detalhe:detalhe || ''});
}
function blocoHistoricoAgenda(a){
  const hs = (a.historico || []).slice().reverse();
  if (!hs.length) return null;
  return h('details', {class:'hist-ag'}, h('summary', null, `🕘 Histórico deste agendamento (${hs.length})`),
    hs.map(x => h('div', {class:'hist-ag-li'}, h('b', null, x.acao), x.detalhe ? ' — ' + x.detalhe : '',
      h('div', {class:'meta'}, new Date(x.em).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) + (x.por ? ' · ' + x.por : '')))));
}
/* escolha de motivo por botões grandes */
function escolhaMotivo(obj, opcoes){
  const caixa = h('div', {class:'chips-motivo'});
  const desenhar = () => { limpar(caixa); opcoes.forEach(m => caixa.appendChild(h('button', {type:'button', class:'chip-mot' + (obj.motivo === m ? ' sel' : ''), onclick:() => { obj.motivo = m; desenhar(); }}, m))); };
  desenhar();
  return caixa;
}
function motivoFinal(o){ return [o.motivo === 'Outro motivo' ? '' : o.motivo, String(o.detalhe || '').trim()].filter(Boolean).join(' — '); }

async function salvarAg(a){
  a.atualizadoEm = Date.now();
  await gravar('atendimentos', a);
  const i = estado.atendimentos.findIndex(x => x.id === a.id);
  if (i >= 0) estado.atendimentos[i] = a; else estado.atendimentos.push(a);
  ordenar();
}

/* ----- REMARCAR ----- */
async function remarcarAgendamento(orig){
  const p = pacientePorId(orig.pacienteId) || {};
  const faltou = orig.status === ST_FALTA, concluido = orig.status === 'Concluído';
  const novo = faltou || concluido;   /* falta/atendimento feito fica guardado; cria um agendamento novo */
  const esc = {data:'', hora:'', horaFim:'', motivo: faltou ? 'Paciente não pode comparecer' : '', detalhe:''};
  const antes = orig.data ? quandoTxt(orig.data, orig.hora) : '';
  const corpo = h('div', null,
    h('div', {class:'resumo-pac'}, avatar(p, 48), h('b', null, p.nome || ''), h('br'),
      orig.status === 'Cancelado' ? '🚫 Cancelado: ' : '📅 Marcado para: ', antes || '—'),
    novo ? h('div', {class:'aviso-ok', style:'margin:8px 0'}, faltou ? 'A falta continua anotada na ficha. Será criado um NOVO agendamento.' : 'Será criado um NOVO agendamento para este paciente.') : null,
    h('h4', {class:'sub-form'}, '1️⃣ Por que vai remarcar?'),
    escolhaMotivo(esc, MOTIVOS_REMARCAR),
    h('div', {class:'grade', style:'margin-top:8px'}, campo(esc, 'detalhe', 'Detalhes (opcional)', {cheio:true, dica:'Ex.: vai viajar, prefere à tarde'})),
    h('h4', {class:'sub-form'}, '2️⃣ Escolha o novo dia e horário'),
    seletorHorario(esc, novo ? null : orig.id));
  const ok = await modal('📅 Remarcar — ' + primeiroNome(p.nome), corpo, [
    {texto:'Voltar', valor:false},
    {texto:'✅ Confirmar nova data', valor:true, classe:'rosa', antes:() => {
      if (!esc.motivo) { toast('Toque no motivo da remarcação'); return false; }
      if (esc.motivo === 'Outro motivo' && !String(esc.detalhe || '').trim()) { toast('Escreva o motivo nos detalhes'); return false; }
      if (!esc.data || !esc.hora) { toast('Escolha o novo dia e o horário'); return false; }
      if (!esc.encaixe && !horariosLivres(esc.data, novo ? null : orig.id).includes(esc.hora)) { toast('Esse horário acabou de ser ocupado. Escolha outro.'); return false; }
    }}], 680);
  if (!ok) return;
  const motivo = motivoFinal(esc);
  const pedirEncaixe = esc.encaixe && !ehAdmin();
  let a;
  if (novo) {
    a = Object.assign(novoAtendimento({pacienteId:orig.pacienteId}), {tipo:orig.tipo, local:orig.local, profissional:orig.profissional, registro:orig.registro,
      data:esc.data, hora:esc.hora, horaFim:esc.horaFim, status:'Agendado', obsAgenda:'Remarcado: ' + motivo, remarcadoDe:orig.id, criadoPor:estado.usuario ? estado.usuario.nome : ''});
    a.numero = formatarNumero(await proximoNumero('contador'), a.data);
    anotarHistorico(a, 'Criado por remarcação', `do Nº ${orig.numero} (${antes}) · ${motivo}`);
    const o = copia(orig); anotarHistorico(o, 'Remarcado', `novo Nº ${a.numero} em ${quandoTxt(a.data, a.hora)} · ${motivo}`); await salvarAg(o);
  } else {
    a = copia(orig);
    const anterior = {data:orig.data, hora:orig.hora, horaFim:orig.horaFim, status:orig.status, obsAgenda:orig.obsAgenda || ''};
    Object.assign(a, {data:esc.data, hora:esc.hora, horaFim:esc.horaFim, status:'Agendado'});
    delete a.cancelamento; delete a.confirmacao;
    anotarHistorico(a, orig.status === 'Cancelado' ? 'Reagendado (estava cancelado)' : 'Remarcado', `${antes || 'sem data'} → ${quandoTxt(esc.data, esc.hora)} · ${motivo}`);
    a.remarcacoes = (a.remarcacoes || 0) + 1;
    if (pedirEncaixe) {
      a.encaixePedido = {por:estado.usuario.nome, porUid:estado.usuario.uid, em:new Date().toISOString(), motivo:'Remarcação em encaixe: ' + motivo, anterior};
      delete a.encaixeDecisao;
    }
  }
  if (pedirEncaixe) {
    if (novo) a.encaixePedido = {por:estado.usuario.nome, porUid:estado.usuario.uid, em:new Date().toISOString(), motivo:'Remarcação em encaixe: ' + motivo, anterior:null};
    a.status = 'Aguardando autorização';
  }
  await salvarAg(a);
  recarregar();
  if (pedirEncaixe) { toast('⏳ Pedido de encaixe enviado para a Kárita'); avisarKaritaEncaixe(a); return; }
  toast('📅 Remarcado para ' + quandoTxt(a.data, a.hora));
  const r = await modal('✅ Remarcado', h('div', null,
    h('div', {class:'aviso-ok'}, `${p.nome || 'Paciente'} agora está marcado(a) para ${quandoTxt(a.data, a.hora)}.`),
    h('p', null, 'Quer avisar o paciente pelo WhatsApp? A mensagem já vai pronta.')),
    [{texto:'Agora não', valor:false}, {texto:'💬 Avisar no WhatsApp', valor:true, classe:'rosa'}]);
  if (r) abrirWhatsPaciente(p, msgAgenda('remarcado', a, p, antes));
}

/* ----- CANCELAR ----- */
async function cancelarAgendamento(orig){
  const p = pacientePorId(orig.pacienteId) || {};
  const esc = {motivo:'', detalhe:''};
  const corpo = h('div', null,
    h('div', {class:'resumo-pac'}, avatar(p, 48), h('b', null, p.nome || ''), h('br'), '📅 ', quandoTxt(orig.data, orig.hora)),
    h('h4', {class:'sub-form'}, 'Por que vai cancelar?'),
    escolhaMotivo(esc, MOTIVOS_CANCELAR),
    h('div', {class:'grade', style:'margin-top:8px'}, campo(esc, 'detalhe', 'Detalhes (opcional)', {cheio:true})),
    h('p', {class:'meta', style:'margin-top:10px'}, 'O horário fica livre para outro paciente. Cancelar com aviso NÃO conta como falta.'));
  const ok = await modal('🚫 Cancelar agendamento', corpo, [
    {texto:'Voltar', valor:false},
    {texto:'🚫 Cancelar agendamento', valor:true, classe:'perigo', antes:() => {
      if (!esc.motivo) { toast('Toque no motivo do cancelamento'); return false; }
      if (esc.motivo === 'Outro motivo' && !String(esc.detalhe || '').trim()) { toast('Escreva o motivo nos detalhes'); return false; }
    }}]);
  if (!ok) return;
  const a = copia(orig), motivo = motivoFinal(esc);
  a.cancelamento = {motivo, por:estado.usuario ? estado.usuario.nome : '', em:new Date().toISOString(), statusAnterior:orig.status};
  a.status = 'Cancelado';
  anotarHistorico(a, 'Cancelado', motivo);
  await salvarAg(a);
  recarregar();
  toast('Agendamento cancelado — horário liberado');
  const r = await modal('🚫 Cancelado', h('div', null,
    h('div', {class:'aviso-ok'}, 'O horário de ' + quandoTxt(a.data, a.hora) + ' está livre de novo.'),
    h('p', null, 'O que deseja fazer agora?')),
    [{texto:'Pronto', valor:null}, {texto:'💬 Avisar no WhatsApp', valor:'zap', classe:'ouro'}, {texto:'📅 Já marcar outra data', valor:'rem', classe:'rosa'}]);
  if (r === 'zap') abrirWhatsPaciente(p, msgAgenda('cancelado', a, p, /Kárita/.test(motivo) ? motivo : ''));
  else if (r === 'rem') remarcarAgendamento(estado.atendimentos.find(x => x.id === a.id));
}

/* ----- CONFIRMAR PRESENÇA ----- */
async function pedirConfirmacao(orig){
  const p = pacientePorId(orig.pacienteId) || {};
  abrirWhatsPaciente(p, msgAgenda('confirmar', orig, p));
  if (!soDigitos(p.telefone)) return;
  const a = copia(orig);
  a.confirmacao = Object.assign({}, a.confirmacao, {pedidaEm:new Date().toISOString(), por:estado.usuario ? estado.usuario.nome : ''});
  anotarHistorico(a, 'Pedido de confirmação enviado', 'WhatsApp');
  await salvarAg(a); recarregar();
}
async function marcarConfirmado(orig){
  const a = copia(orig);
  a.confirmacao = Object.assign({}, a.confirmacao, {confirmadoEm:new Date().toISOString(), por:estado.usuario ? estado.usuario.nome : ''});
  anotarHistorico(a, 'Paciente confirmou presença', '');
  await salvarAg(a); toast('👍 Presença confirmada'); recarregar();
}
async function marcarCompareceu(orig){
  const a = copia(orig); a.status = 'Concluído'; anotarHistorico(a, 'Compareceu', ''); await salvarAg(a); toast('Marcado como compareceu'); recarregar();
}

/* ----- JANELA DE AÇÕES (um toque) ----- */
function seloConfirmacao(a){
  const c = a.confirmacao || {};
  if (a.status !== 'Agendado') return null;
  if (c.confirmadoEm) return h('span', {class:'selo verde', style:'margin-top:4px'}, '👍 Confirmado');
  if (c.pedidaEm) return h('span', {class:'selo', style:'margin-top:4px'}, '💬 Aguardando resposta');
  return null;
}
async function acoesAgenda(a, retorno){
  const p = pacientePorId(a.pacienteId) || {};
  const adm = ehAdmin();
  if (!retorno && adm && a.status === 'Aguardando autorização') { await revisarEncaixe(a.id); return; }
  const hoje = hojeISO();
  const st = a.status;
  const ativo = ['Agendado', 'Aguardando autorização'].includes(st);
  const tiles = [];
  const t = (ico, txt, sub, v, cls) => tiles.push({ico, txt, sub, v, cls});
  if (retorno) {
    t('＋', adm ? 'Registrar o retorno' : 'Agendar o retorno', 'Marcar o retorno na agenda', 'ret', 'rosa');
  } else {
    if (st === 'Agendado' && a.data <= hoje) { t('✅', 'Compareceu', 'O paciente veio', 'veio', 'verde'); t('❌', 'Faltou', 'Não veio e não avisou', 'falta', 'vermelho'); }
    if (ativo) {
      t('📅', 'Remarcar', 'Escolher outro dia e horário', 'rem', 'rosa');
      t('🚫', 'Cancelar', 'Libera o horário', 'canc', 'cinza');
      if (st === 'Agendado' && a.data >= hoje) {
        if (!(a.confirmacao || {}).confirmadoEm) t('💬', 'Pedir confirmação', 'Mensagem pronta no WhatsApp', 'conf', 'ouro');
        if ((a.confirmacao || {}).pedidaEm && !(a.confirmacao || {}).confirmadoEm) t('👍', 'Paciente confirmou', 'Marcar como confirmado', 'confok', 'verde');
      }
    }
    if (st === ST_FALTA) { t('📅', 'Remarcar', 'Novo agendamento (a falta fica anotada)', 'rem', 'rosa'); t('↩', 'Ele veio', 'Desfazer a falta', 'desf', 'cinza'); }
    if (st === 'Cancelado') t('📅', 'Reagendar', 'Marcar nova data', 'rem', 'rosa');
    if (adm) t('📄', 'Relatório', 'Ver / imprimir', 'rel', 'ouro');
    if (adm) t('🩺', 'Ficha do atendimento', 'Procedimentos e medicamentos', 'ed', 'rosa');
    t('💰', 'Recebimento', 'Lançar pagamento', 'fin', 'ouro');
    if (!adm || st !== 'Concluído') t('✏️', 'Editar agendamento', 'Tipo, local e observação', 'ag', 'cinza');
  }
  let escolha = null;
  const grade = h('div', {class:'acoes-ag'}, tiles.map(x => h('button', {type:'button', class:'tile-ag ' + (x.cls || ''), onclick:e => {
    escolha = x.v; const bg = e.currentTarget.closest('.modal-bg'); if (bg) bg.querySelector('.x').click(); }},
    h('span', {class:'tile-ico'}, x.ico), h('b', null, x.txt), h('small', null, x.sub))));
  const can = a.cancelamento;
  const corpo = h('div', null,
    h('div', {class:'resumo-pac'}, avatar(p, 52),
      h('b', null, retorno ? `Retorno marcado para ${fmtData(a.retorno)}` : quandoTxt(a.data, a.hora) + (a.horaFim ? ' até ' + a.horaFim : '')), h('br'),
      `Nº ${a.numero} · ${a.tipo || ''}`, h('br'),
      h('span', {style:'display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:4px'}, seloStatus(st), seloConfirmacao(a)),
      p.telefone ? h('div', null, '📞 ' + p.telefone) : null),
    st === 'Cancelado' && can ? h('div', {class:'aviso-bloq'}, `🚫 Cancelado${can.motivo ? ': ' + can.motivo : ''}${can.por ? ' (por ' + can.por + ')' : ''}`) : null,
    adm && p.alergias ? h('div', {class:'alerta'}, '⚠️ Alergias: ' + p.alergias) : null,
    adm && a.queixa ? h('p', {style:'margin:8px 0 0'}, h('b', null, 'Motivo: '), a.queixa) : null,
    a.obsAgenda ? h('p', {style:'margin:6px 0 0'}, h('b', null, 'Obs.: '), a.obsAgenda) : null,
    alertaFaltas(p),
    grade,
    blocoHistoricoAgenda(a));
  await modal(p.nome || 'Agendamento', corpo, [], 560);
  const r = escolha;
  if (!r) return;
  if (r === 'veio') return marcarCompareceu(a);
  if (r === 'falta') { if (await confirmar('Registrar que o paciente faltou SEM avisar? Fica anotado na ficha dele. (Se ele avisou antes, use "Cancelar" ou "Remarcar".)', 'Falta', 'Registrar falta', true)) { await registrarFalta(a, false); toast('Falta registrada na ficha'); recarregar(); } return; }
  if (r === 'desf') { await desfazerFalta(a.id); recarregar(); return; }
  if (r === 'rem') return remarcarAgendamento(a);
  if (r === 'canc') return cancelarAgendamento(a);
  if (r === 'conf') return pedirConfirmacao(a);
  if (r === 'confok') return marcarConfirmado(a);
  if (r === 'rel') return abrirRelatorio(a.id);
  if (r === 'ed') return editarAtendimento(a.id);
  if (r === 'fin') return editarLancamento(null, {tipo:'receita', pacienteId:a.pacienteId, atendimentoId:a.id});
  if (r === 'ag') return editarAgendamento(a.id);
  if (r === 'ret') return editarAgendamento(null, {pacienteId:a.pacienteId, data:a.retorno >= hojeISO() ? a.retorno : hojeISO(), tipo:'Retorno'});
}
function cartaoAgendaHoje(){
  const evs = eventosDoDia(hojeISO());
  return h('div', {class:'cartao'}, h('h2', null, '📅 Agenda de hoje'),
    avisosBloqueioDia(hojeISO()),
    evs.length ? evs.map(linhaAgenda) : h('div', {class:'meta', style:'color:var(--cinza)'}, 'Nenhum atendimento marcado para hoje.'),
    h('div', {class:'acoes'}, h('button', {class:'btn ouro peq', onclick:() => { estado.agenda.data = hojeISO(); estado.agenda.modo = 'dia'; ir('agenda'); }}, 'Ver agenda completa')));
}
function telaAgenda(area){
  const ag = estado.agenda;
  if (!ag.data) ag.data = hojeISO();
  const hoje = hojeISO();
  const d = dataDe(ag.data);
  const iniSemana = somarDias(ag.data, -d.getDay());
  const mover = n => {
    if (ag.modo === 'mes') { const x = dataDe(ag.data); x.setDate(1); x.setMonth(x.getMonth() + n); ag.data = isoDe(x); }
    else ag.data = somarDias(ag.data, n * (ag.modo === 'semana' ? 7 : 1));
    ir('agenda');
  };
  const irDia = iso => { ag.data = iso; ag.modo = 'dia'; ir('agenda'); };
  let rotulo;
  if (ag.modo === 'dia') rotulo = `${DIAS_LONGO[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  else if (ag.modo === 'semana') rotulo = `${fmtData(iniSemana).slice(0, 5)} a ${fmtData(somarDias(iniSemana, 6))}`;
  else rotulo = MESES[d.getMonth()].charAt(0).toUpperCase() + MESES[d.getMonth()].slice(1) + ' de ' + d.getFullYear();

  { const pe = ehAdmin() ? painelEncaixes() : meusEncaixes(); if (pe) area.appendChild(pe); }
  area.appendChild(h('div', {class:'titulo-pag'}, h('h2', null, '📅 Agenda'),
    h('div', {class:'acoes', style:'margin:0'},
      h('button', {class:'btn', onclick:gerenciarBloqueios}, '🚫 Dias sem atendimento'),
      h('button', {class:'btn rosa', onclick:() => editarAgendamento(null, {data:ag.data >= hojeISO() ? ag.data : hojeISO()})}, '＋ Agendar'))));

  const pular = h('input', {type:'date', value:ag.data, style:'max-width:170px'});
  pular.addEventListener('change', () => { if (pular.value) { ag.data = pular.value; ir('agenda'); } });
  area.appendChild(h('div', {class:'cartao'},
    h('div', {class:'ag-topo'},
      h('button', {class:'btn peq', title:'Anterior', onclick:() => mover(-1)}, '◀'),
      h('div', {class:'rotulo'}, rotulo),
      h('button', {class:'btn peq', title:'Próximo', onclick:() => mover(1)}, '▶')),
    h('div', {class:'ag-topo', style:'margin-top:10px;justify-content:space-between'},
      h('div', {style:'display:flex;gap:6px;align-items:center'},
        h('button', {class:'btn ouro peq', onclick:() => { ag.data = hoje; ir('agenda'); }}, 'Hoje'), pular),
      h('div', {class:'modos'}, [['dia','Dia'], ['semana','Semana'], ['mes','Mês']].map(([k, t]) =>
        h('button', {class: ag.modo === k ? 'ativo' : '', onclick:() => { ag.modo = k; ir('agenda'); }}, t))))));

  const listaDoDia = iso => {
    const evs = eventosDoDia(iso);
    const avisos = avisosBloqueioDia(iso).concat(!diaAtende(iso) ? [h('div', {class:'aviso-bloq'}, '🕘 Dia sem expediente nos horários de atendimento.')] : []);
    if (!evs.length) return h('div', null, avisos, h('div', {class:'vazio'}, h('span', {class:'ico'}, '🗓️'), 'Nenhum atendimento neste dia.',
      h('div', {style:'margin-top:10px'}, h('button', {class:'btn rosa', onclick:() => editarAgendamento(null, {data:iso >= hojeISO() ? iso : hojeISO()})}, '＋ Agendar neste dia'))));

/* =========================================================
   FINANCEIRO — recebimentos, despesas, parcelas e recibos
   ========================================================= */
const FORMAS = ['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Parcelado na clínica (crediário)','Boleto','Transferência','Cheque','Convênio','Outro'];
const FORMAS_AVISTA = ['Pix','Dinheiro','Cartão de débito','Transferência'];
const CAT_RECEITA = ['Consulta','Procedimento','Retorno','Pacote / tratamento','Venda de produto','Convênio','Outros'];
const CAT_DESPESA = ['Aluguel','Água / luz / internet','Material e insumos','Medicamentos','Salários e pró-labore','Impostos e taxas','Taxas da maquininha','Equipamentos','Manutenção','Marketing','Contador','Limpeza','Outros'];
const moeda = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
function lerValor(s){
  if (typeof s === 'number') return s;
  s = String(s || '').replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.round(n * 100) / 100;
}
const valorTexto = v => v ? Number(v).toFixed(2).replace('.', ',') : '';
function somarMeses(iso, n){
  const d = dataDe(iso), dia = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, ult));
  return isoDe(d);
}
function extenso(valor){
  const un = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ct = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = n => {
    if (!n) return '';
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(ct[c]);
    if (r) { if (r < 20) p.push(un[r]); else { const d = Math.floor(r / 10), u = r % 10; p.push(u ? dz[d] + ' e ' + un[u] : dz[d]); } }
    return p.join(' e ');
  };
  const totalCent = Math.round((Number(valor) || 0) * 100);
  const inteiro = Math.floor(totalCent / 100), cent = totalCent % 100;
  const grupos = []; let n = inteiro;
  while (n > 0) { grupos.push(n % 1000); n = Math.floor(n / 1000); }
  const nomes = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
  const partes = [];
  for (let i = grupos.length - 1; i >= 0; i--) {
    const g = grupos[i]; if (!g) continue;
    let t = (i === 1 && g === 1) ? 'mil' : ate999(g) + (i > 0 ? ' ' + (g === 1 ? nomes[i][0] : nomes[i][1]) : '');
    partes.push({t, g, i});
  }
  let txt = '';
  partes.forEach((p, k) => {
    if (k === 0) { txt = p.t; return; }
    const ult = k === partes.length - 1;
    txt += (ult && (p.g < 100 || p.g % 100 === 0)) ? ' e ' + p.t : (partes[k - 1].i === 1 ? ' ' : ', ') + p.t;
  });
  let r = '';
  if (inteiro) r = txt + ((grupos.length > 2 && !grupos[0] && !grupos[1]) ? ' de' : '') + (inteiro === 1 ? ' real' : ' reais');
  if (cent) { const c = ate999(cent) + (cent === 1 ? ' centavo' : ' centavos'); r = r ? r + ' e ' + c : c; }
  return r || 'zero reais';
}
function valorFinal(l){ return Math.max(0, Math.round(((l.valor || 0) - (l.desconto || 0)) * 100) / 100); }
function gerarParcelas(l, antigas){
  const n = Math.max(1, parseInt(l.nParcelas, 10) || 1);
  const cents = Math.round(valorFinal(l) * 100);
  const base = Math.floor(cents / n), resto = cents - base * n;
  const ps = [];
  for (let i = 0; i < n; i++) {
    const ant = (antigas || [])[i];
    ps.push({n:i + 1, vencimento:somarMeses(l.primeiroVenc || l.data || hojeISO(), i),
      valor:(base + (i === n - 1 ? resto : 0)) / 100,
      pago: ant ? !!ant.pago : false, dataPagamento: ant ? (ant.dataPagamento || '') : ''});
  }
  return ps;
}
function situacao(l){
  const ps = l.parcelas || [];
  const pagas = ps.filter(p => p.pago).length;
  if (ps.length && pagas === ps.length) return 'Quitado';
  if (ps.some(p => !p.pago && p.vencimento < hojeISO())) return 'Atrasado';
  return pagas ? 'Parcial' : 'Em aberto';
}
function seloSituacao(l){
  const s = situacao(l);
  const txt = l.tipo === 'despesa' ? ({'Quitado':'Pago', 'Atrasado':'Vencido', 'Parcial':'Parcial', 'Em aberto':'A pagar'})[s] : s;
  return h('span', {class:'selo ' + (s === 'Quitado' ? 'verde' : s === 'Atrasado' ? 'vermelho' : 'ouro')}, txt);
}
function todasParcelas(tipo){
  const out = [];
  estado.financeiro.filter(l => l.tipo === tipo).forEach(l => (l.parcelas || []).forEach((p, i) => out.push({l, p, i})));
  return out;
}
const somaP = arr => arr.reduce((s, x) => s + (x.p.valor || 0), 0);
const dataEfetiva = p => p.dataPagamento || p.vencimento;
function nomeLanc(l){
  if (l.tipo === 'receita') { const p = pacientePorId(l.pacienteId); return p ? p.nome : (l.descricao || 'Recebimento'); }
  return l.descricao || l.categoria || 'Despesa';
}
function resumoFinPaciente(pid){
  let total = 0, pago = 0, atrasado = 0;
  const hoje = hojeISO();
  estado.financeiro.filter(l => l.tipo === 'receita' && l.pacienteId === pid).forEach(l => {
    total += valorFinal(l);
    (l.parcelas || []).forEach(p => { if (p.pago) pago += p.valor; else if (p.vencimento < hoje) atrasado += p.valor; });
  });
  return {total, pago, aberto:Math.max(0, total - pago), atrasado};
}
function seloPagAtendimento(atId){
  const ls = estado.financeiro.filter(l => l.atendimentoId === atId);
  if (!ls.length) return null;
  const tot = ls.reduce((s, l) => s + valorFinal(l), 0);
  const pago = ls.reduce((s, l) => s + (l.parcelas || []).filter(p => p.pago).reduce((a, p) => a + p.valor, 0), 0);
  const ok = pago >= tot - 0.004;
  return h('span', {class:'selo ' + (ok ? 'verde' : 'ouro')}, ok ? '💰 Pago' : '💰 ' + moeda(tot - pago) + ' em aberto');
}

function cartaoLancamento(l, compacto){
  const rec = l.tipo === 'receita';
  const tot = valorFinal(l), ps = l.parcelas || [];
  const pago = ps.filter(p => p.pago).reduce((s, p) => s + p.valor, 0);
  const pc = tot ? Math.min(100, Math.round(pago / tot * 100)) : 0;
  const acao = fn => () => { if (compacto) fecharModais(); fn(); };
  const prox = proximaPendente(l), evp = prox ? estadoVenc(prox) : null;
  return h('div', {class:'item' + (rec ? '' : ' desp') + (evp ? ' iv-' + evp.cls : '')},
    h('div', {class:'item-topo'},
      h('div', {style:'min-width:0'},
        h('h4', null, rec ? nomeLanc(l) : (l.descricao || l.categoria)),
        h('div', {class:'meta'}, [fmtData(l.data), rec ? l.descricao : l.fornecedor, l.categoria].filter(Boolean).join(' · '))),
      h('div', {style:'text-align:right'}, h('div', {class:'valor ' + (rec ? 'pos' : 'neg')}, (rec ? '' : '− ') + moeda(tot)), seloSituacao(l))),

    prox ? h('div', {style:'margin-top:6px'}, h('span', {class:'meta'}, `Próxima: ${moeda(prox.valor)} · `), seloVenc(prox)) : null,

      ehAdmin() ? h('button', {class:'btn perigo peq', onclick:acao(() => excluirLancamento(l.id))}, '🗑️') : null));
}

async function editarLancamento(id, pre){
  pre = pre || {};
  const orig = id ? estado.financeiro.find(x => x.id === id) : null;
  if (!ehAdmin() && ((orig && orig.tipo !== 'receita') || (!orig && pre.tipo && pre.tipo !== 'receita'))) return null;
  if (orig) await garantirFotos(orig.comprovantes);
  const l = orig ? copia(orig) : Object.assign({id:uid(), tipo:'receita', pacienteId:'', atendimentoId:'', descricao:'', categoria:'', fornecedor:'',
    data:hojeISO(), valor:0, desconto:0, forma:'Pix', nParcelas:'1', primeiroVenc:hojeISO(), taxa:0, parcelas:[], comprovantes:[], obs:'', criadoEm:Date.now()}, pre);
  const rec = l.tipo === 'receita';
  const novo = !orig;
  if (!l.categoria) l.categoria = rec ? CAT_RECEITA[0] : CAT_DESPESA[0];
  if (!Array.isArray(l.comprovantes)) l.comprovantes = [];
  if (!Array.isArray(l.parcelas)) l.parcelas = [];
  l.nParcelas = String(l.parcelas.length || l.nParcelas || 1);
  if (pre.atendimentoId && !l.descricao) {
    const at = estado.atendimentos.find(a => a.id === pre.atendimentoId);
    if (at) { l.descricao = `${at.tipo} — atendimento Nº ${at.numero}`; if (CAT_RECEITA.includes(at.tipo)) l.categoria = at.tipo; }
  }
  const txt = {valor:valorTexto(l.valor), desconto:valorTexto(l.desconto), taxa: l.taxa ? String(l.taxa).replace('.', ',') : ''};
  if (novo) l.parcelas = gerarParcelas(l);
  let tocou = false;
  const ajustarAvista = () => {
    if (novo && !tocou && l.parcelas.length === 1) {
      const pg = FORMAS_AVISTA.includes(l.forma);
      l.parcelas[0].pago = pg; l.parcelas[0].dataPagamento = pg ? (l.data || hojeISO()) : '';
    }
  };
  const caixaParc = h('div');
  const resumo = h('div', {class:'resumo-pac'});
  const recalcular = regerar => {
    l.valor = lerValor(txt.valor); l.desconto = lerValor(txt.desconto); l.taxa = lerValor(txt.taxa);
    if (regerar) { l.parcelas = gerarParcelas(l, l.parcelas); ajustarAvista(); }
    desenharParcelas(); desenharResumo();
  };
  function desenharResumo(){
    limpar(resumo);
    const tot = valorFinal(l), n = l.parcelas.length;
    resumo.appendChild(h('div', null, h('b', null, 'Valor final: ' + moeda(tot)),
      n > 1 ? ` · ${n}x de ${moeda(l.parcelas[0].valor)}` : '',
      l.taxa ? h('div', null, `Taxa de ${String(l.taxa).replace('.', ',')}%: − ${moeda(tot * l.taxa / 100)} → valor líquido ${moeda(tot * (1 - l.taxa / 100))}`) : null));
    const soma = l.parcelas.reduce((s, p) => s + (p.valor || 0), 0);
    if (Math.abs(soma - tot) > 0.009) resumo.appendChild(h('div', {class:'alerta'}, `Atenção: a soma das parcelas (${moeda(soma)}) está diferente do valor final.`));
  }
  function desenharParcelas(){

    l.parcelas.forEach((p, i) => {
      const venc = h('input', {type:'date', value:p.vencimento});
      venc.addEventListener('change', () => { p.vencimento = venc.value; });
      const val = h('input', {type:'text', inputmode:'decimal', value:valorTexto(p.valor)});
      val.addEventListener('input', () => { p.valor = lerValor(val.value); desenharResumo(); });
      const ck = h('input', {type:'checkbox', checked:p.pago});
      const dp = h('input', {type:'date', value:p.dataPagamento || '', title:'Data do pagamento', style: p.pago ? '' : 'visibility:hidden'});
      dp.addEventListener('change', () => { p.dataPagamento = dp.value; });
      ck.addEventListener('change', () => {
        tocou = true; p.pago = ck.checked;
        if (p.pago && !p.dataPagamento) { p.dataPagamento = hojeISO(); dp.value = p.dataPagamento; }

  } else {

  }

  const corpo = h('div', {class:'grade'},
    quem,
    campo(l, 'descricao', 'Descrição', {cheio:true, dica: rec ? 'Ex.: Consulta, pacote de 5 sessões...' : 'Ex.: Aluguel de novembro'}),
    campo(l, 'categoria', 'Categoria', {tipo:'select', opcoes: rec ? CAT_RECEITA : CAT_DESPESA}),
    campo(l, 'data', 'Data do lançamento', {tipo:'date'}),
    campo(txt, 'valor', 'Valor (R$)', {obrig:true, im:'decimal', dica:'0,00', aoMudar:() => recalcular(true)}),
    campo(txt, 'desconto', 'Desconto (R$)', {im:'decimal', dica:'0,00', aoMudar:() => recalcular(true)}),
    campo(l, 'forma', 'Forma de pagamento', {tipo:'select', opcoes:FORMAS, aoMudar:() => { ajustarAvista(); desenharParcelas(); }}),
    campo(l, 'nParcelas', 'Número de parcelas', {tipo:'select', opcoes:Array.from({length:24}, (_, i) => String(i + 1)), aoMudar:() => recalcular(true)}),
    campo(l, 'primeiroVenc', 'Vencimento da 1ª parcela', {tipo:'date', aoMudar:() => recalcular(true)}),
    campo(txt, 'taxa', 'Taxa da maquininha em % (opcional)', {im:'decimal', dica:'Ex.: 3,5', aoMudar:() => recalcular(false)}),

    h('div', {class:'campo full'},
      h('div', {class:'acoes', style:'margin:0 0 4px'},
        h('button', {class:'btn peq', type:'button', onclick:() => { tocou = true; l.parcelas.forEach(p => { p.pago = true; if (!p.dataPagamento) p.dataPagamento = hojeISO(); }); desenharParcelas(); }}, '✓ Marcar todas'),
        h('button', {class:'btn peq', type:'button', onclick:() => { tocou = true; l.parcelas.forEach(p => { p.pago = false; p.dataPagamento = ''; }); desenharParcelas(); }}, 'Desmarcar todas')),

  if (novo) ajustarAvista();

  const ok = await modal((orig ? 'Editar ' : 'Novo ') + (rec ? 'recebimento' : 'despesa'), corpo, [

async function excluirLancamento(id){
  const l = estado.financeiro.find(x => x.id === id);

function relatorioFinanceiroMes(mes){

  const desp = D.filter(x => x.p.pago && dataEfetiva(x.p).startsWith(mes)).sort((a, b) => dataEfetiva(a.p).localeCompare(dataEfetiva(b.p)));
  const pendR = R.filter(x => !x.p.pago && x.p.vencimento.startsWith(mes));
  const pendD = D.filter(x => !x.p.pago && x.p.vencimento.startsWith(mes));

      h('tr', null, h('td', {colspan:'4', style:'font-weight:700'}, 'Total'), h('td', {class:'dir', style:'font-weight:700'}, moeda(somaP(arr)))))
      : h('div', {style:'padding:8px 11px'}, 'Nenhum lançamento.')));
  const folha = h('div', {class:'folha'},
    cabecalhoDoc('Período', nomeMes.split(' DE ')[0], String(ano)),

      h('div', null, h('small', null, 'A receber no mês (pendente)'), moeda(somaP(pendR))),
      h('div', null, h('small', null, 'A pagar no mês (pendente)'), moeda(somaP(pendD)))))),
    tab('Recebimentos', rec, 'Recebido em'),

  mostrarDocumento(folha);
}

const portalCfg = () => { if (!estado.config.portal) estado.config.portal = {}; return estado.config.portal; };
const portalModo = () => { if (emNuvem()) return 'firebase'; const c = portalCfg(); return c.projectId && c.apiKey && c.refreshToken ? 'firebase' : 'teste'; };
let tokenPortal = {token:'', expira:0};
async function tokenFirebase(){
  if (emNuvem()) return tokenSessao();
  const c = portalCfg();
  if (tokenPortal.token && Date.now() < tokenPortal.expira) return tokenPortal.token;
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(c.apiKey), {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(c.refreshToken)});
  if (!r.ok) throw new Error('login');

function reduzirImagem(src, max, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const esc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      } catch (e) { res(src); }
    };
    img.onerror = () => res('');
    img.src = src;
  });
}

async function publicarPaciente(pid){
  const p = pacientePorId(pid);
  if (!p) return 0;
  const cpf = soDigitos(p.cpf);
  const ats = estado.atendimentos.filter(a => a.pacienteId === pid);
  const hoje = hojeISO();
  const algumLiberado = ats.some(a => a.portal && a.portal.liberado && a.portal.validade >= hoje);
  if (algumLiberado && !cpfValido(cpf)) throw new Error('cpf');
  if (algumLiberado && !p.codigoPortal) { p.codigoPortal = gerarCodigoPortal(); await gravar('pacientes', p); }
  const lista = [];
  let maior = hoje;
  for (const a of ats) {
    const pt = a.portal || {};
    const ativo = !!(pt.liberado && pt.validade && pt.validade >= hoje && cpfValido(cpf));
    const novoId = ativo ? idLaudoPortal(cpf, p.codigoPortal, a.id) : '';
    if (pt.docId && pt.docId !== novoId) await portalApagarDoc(PORTAL_COL_LAUDO, pt.docId);
    if (ativo) {
      const doc = await trancar(await montarLaudo(a, p), cpf, p.codigoPortal);
      await portalGravarDoc(PORTAL_COL_LAUDO, novoId, Object.assign(doc, {validade:fimDoDia(pt.validade)}));
      lista.push({id:a.id, numero:a.numero, data:a.data, hora:a.hora || '', tipo:a.tipo, validade:pt.validade});
      if (pt.validade > maior) maior = pt.validade;
      a.portal = Object.assign({}, pt, {docId:novoId, publicadoEm:Date.now()});
    } else a.portal = Object.assign({}, pt, {docId:''});
    await gravar('atendimentos', a);
  }
  const novoIdx = lista.length ? idIndicePortal(cpf, p.codigoPortal) : '';
  if (p.portalIndiceId && p.portalIndiceId !== novoIdx) await portalApagarDoc(PORTAL_COL_IDX, p.portalIndiceId);
  if (lista.length) {
    lista.sort((x, y) => (y.data + y.hora).localeCompare(x.data + x.hora));
    const doc = await trancar({paciente:p.nome, clinica:estado.config.nome || '', laudos:lista, atualizado:new Date().toISOString()}, cpf, p.codigoPortal);
    await portalGravarDoc(PORTAL_COL_IDX, novoIdx, Object.assign(doc, {validade:fimDoDia(maior)}));
  }
  p.portalIndiceId = novoIdx;
  await gravar('pacientes', p);
  return lista.length;
}

  if (m === 'regras') return 'O Firebase recusou a gravação. Confira as regras de segurança em ⚙️ Ajustes › Portal do paciente.';

function traduzErroFirebase(m){
  m = String(m || '');
  if (/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return 'e-mail ou senha errados.';
  if (/API key|API_KEY/.test(m)) return 'a chave da web (Web API Key) está errada.';
  if (/TOO_MANY/.test(m)) return 'muitas tentativas. Espere alguns minutos.';
  if (/Failed to fetch|NetworkError/.test(m)) return 'sem internet.';
  return m;
}
async function baixarSiteConfigurado(){
  const c0 = portalCfg();
  const c = emNuvem() ? {projectId:NUVEM.projectId, apiKey:NUVEM.apiKey} : c0;
  let txt;
  try { const r = await fetch('index.html', {cache:'no-store'}); if (!r.ok) throw 0; txt = await r.text(); }
  catch (e) { await aviso('Para baixar o site configurado, abra o painel pelo endereço do site (Netlify), e não pelo arquivo no aparelho.', 'Baixar site'); return; }
  if (!/const PORTAL = \{[^}]*\};/.test(txt)) { await aviso('Não encontrei o site original (index.html) junto do painel.', 'Baixar site'); return; }
  txt = txt.replace(/const PORTAL = \{[^}]*\};/, `const PORTAL = {projectId:'${(c.projectId || '').replace(/'/g, '')}', apiKey:'${(c.apiKey || '').replace(/'/g, '')}'};`);
  if (estado.config.testeRemovido || !temDadosTeste()) {
    txt = txt.replace(/const DEMONSTRACAO = (true|false);/, 'const DEMONSTRACAO = false;').replace(/const DEMO_DOCS = .*;\n/, 'const DEMO_DOCS = {};\n');
  }
  const sc = Object.assign({especialidade:'', whatsapp:'', telefone:'', email:'', endereco:'', horario:'', mapa:'', instagram:'', facebook:'', tiktok:'', youtube:'', linkedin:''}, estado.config.site || {});
  if (/\/\*SITE_INICIO\*\/[\s\S]*?\/\*SITE_FIM\*\//.test(txt)) txt = txt.replace(/\/\*SITE_INICIO\*\/[\s\S]*?\/\*SITE_FIM\*\//, '/*SITE_INICIO*/\nconst SITE = ' + JSON.stringify(sc).replace(/</g, '\\u003c') + ';\n/*SITE_FIM*/');
  txt = txt.replace(/const VERSAO = '[^']*';/, `const VERSAO = '${VERSAO}';`);
  const a = h('a', {href:URL.createObjectURL(new Blob([txt], {type:'text/html'})), download:'index.html'});
  document.body.appendChild(a); a.click(); a.remove();
  toast('Site configurado baixado. Envie ao Netlify junto com o painel.');
}

/* =========================================================
   ALERTAS DE PAGAMENTO (cores por vencimento)
   ========================================================= */
function estadoVenc(p){
  if (p.pago) return {cls:'pago', txt:'Pago', ico:'✅', ord:5, d:0};
  const d = Math.round((dataDe(p.vencimento) - dataDe(hojeISO())) / 86400000);
  if (d < 0) return {cls:'vencido', txt:`Vencida há ${-d} dia${d === -1 ? '' : 's'}`, ico:'🔴', ord:0, d};
  if (d === 0) return {cls:'hoje', txt:'Vence HOJE', ico:'🟠', ord:1, d};
  if (d <= 3) return {cls:'breve', txt: d === 1 ? 'Vence amanhã' : `Vence em ${d} dias`, ico:'🟡', ord:2, d};
  if (d <= 7) return {cls:'semana', txt:`Vence em ${d} dias`, ico:'🟨', ord:3, d};
  return {cls:'futuro', txt:'Vence em ' + fmtData(p.vencimento), ico:'⚪', ord:4, d};
}
const seloVenc = p => { const e = estadoVenc(p); return h('span', {class:'selo sv-' + e.cls}, e.ico + ' ' + e.txt); };
function proximaPendente(l){ return (l.parcelas || []).filter(p => !p.pago).sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0] || null; }
function resumoAlertas(tipo){
  const lista = todasParcelas(tipo).filter(x => !x.p.pago).map(x => Object.assign(x, {ev:estadoVenc(x.p)}));
  const grupo = cls => lista.filter(x => cls.includes(x.ev.cls));
  return {vencidas:grupo(['vencido']), hoje:grupo(['hoje']), breve:grupo(['breve', 'semana'])};
}
function contagemAlertas(){
  const r = resumoAlertas('receita');
  let n = r.vencidas.length + r.hoje.length;
  if (ehAdmin()) { const d = resumoAlertas('despesa'); n += d.vencidas.length + d.hoje.length; }
  return n;
}
function painelAlertasPagamento(){
  const blocos = [];
  const montar = (tipo, titulo) => {
    const r = resumoAlertas(tipo);
    if (!r.vencidas.length && !r.hoje.length && !r.breve.length) return;
    const ir_ = filtro => { estado.fin.aba = 'receber'; estado.fin.filtro = filtro; ir('financeiro'); };
    blocos.push(h('div', null, h('div', {class:'alertas-tit'}, titulo),
      h('div', {class:'alertas'},
        r.vencidas.length ? h('button', {class:'alerta-box av-vencido', onclick:() => ir_('vencido')}, h('b', null, `🔴 ${r.vencidas.length} vencida(s)`), h('span', null, moeda(somaP(r.vencidas)))) : null,
        r.hoje.length ? h('button', {class:'alerta-box av-hoje', onclick:() => ir_('hoje')}, h('b', null, `🟠 ${r.hoje.length} vence(m) hoje`), h('span', null, moeda(somaP(r.hoje)))) : null,
        r.breve.length ? h('button', {class:'alerta-box av-breve', onclick:() => ir_('breve')}, h('b', null, `🟡 ${r.breve.length} nos próximos 7 dias`), h('span', null, moeda(somaP(r.breve)))) : null)));
  };
  montar('receita', '📥 A receber');
  if (ehAdmin()) montar('despesa', '📤 A pagar');
  if (!blocos.length) return null;
  return h('div', {class:'cartao cartao-alertas'}, h('h2', null, '⚠️ Alertas de pagamento'), blocos);
}

/* =========================================================
   HORÁRIOS DE ATENDIMENTO E HORÁRIOS LIVRES
   ========================================================= */
const AGENDA_PADRAO = {duracao:30, diasAFrente:60, dias:{
  0:{ativo:false, inicio:'08:00', fim:'12:00', pausaIni:'', pausaFim:''},
  1:{ativo:true, inicio:'08:00', fim:'18:00', pausaIni:'12:00', pausaFim:'13:00'},
  2:{ativo:true, inicio:'08:00', fim:'18:00', pausaIni:'12:00', pausaFim:'13:00'},
  3:{ativo:true, inicio:'08:00', fim:'18:00', pausaIni:'12:00', pausaFim:'13:00'},
  4:{ativo:true, inicio:'08:00', fim:'18:00', pausaIni:'12:00', pausaFim:'13:00'},
  5:{ativo:true, inicio:'08:00', fim:'18:00', pausaIni:'12:00', pausaFim:'13:00'},
  6:{ativo:true, inicio:'08:00', fim:'12:00', pausaIni:'', pausaFim:''}}};
const cfgAgenda = () => { const c = estado.config.agendaCfg; return c && c.dias ? c : copia(AGENDA_PADRAO); };
const minutos = hm => { const [a, b] = String(hm || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const hmDe = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function bloqueiosDoDia(iso){ return (estado.bloqueios || []).filter(b => b.inicio <= iso && iso <= (b.fim || b.inicio)); }
const diaBloqueadoInteiro = iso => bloqueiosDoDia(iso).some(b => b.diaInteiro !== false);
const diaAtende = iso => !!(cfgAgenda().dias[dataDe(iso).getDay()] || {}).ativo;
function horariosLivres(iso, ignorarId){
  const cfg = cfgAgenda(), d = cfg.dias[dataDe(iso).getDay()];
  if (!d || !d.ativo || diaBloqueadoInteiro(iso)) return [];
  const dur = cfg.duracao || 30, ini = minutos(d.inicio), fim = minutos(d.fim);
  const ocup = estado.atendimentos.filter(a => a.data === iso && a.id !== ignorarId && a.status !== 'Cancelado' && a.hora)
    .map(a => [minutos(a.hora), a.horaFim && minutos(a.horaFim) > minutos(a.hora) ? minutos(a.horaFim) : minutos(a.hora) + dur]);
  bloqueiosDoDia(iso).filter(b => b.diaInteiro === false).forEach(b => ocup.push([minutos(b.horaIni), minutos(b.horaFim)]));
  if (d.pausaIni && d.pausaFim && minutos(d.pausaFim) > minutos(d.pausaIni)) ocup.push([minutos(d.pausaIni), minutos(d.pausaFim)]);
  const agora = iso === hojeISO() ? new Date().getHours() * 60 + new Date().getMinutes() : -1;
  const out = [];
  for (let t = ini; t + dur <= fim; t += dur) {
    if (t <= agora) continue;
    if (ocup.some(([a, b]) => t < b && t + dur > a)) continue;
    out.push(hmDe(t));
  }
  return out;
}
function seletorHorario(a, ignorarId){
  const caixa = h('div', {class:'campo full'});
  let encaixe = false;
  const desenhar = () => {
    limpar(caixa);
    const cfg = cfgAgenda(), hoje = hojeISO();
    caixa.appendChild(h('span', null, '📅 Escolha o dia', h('b', {class:'req'}, ' *')));
    const dias = h('div', {class:'dias-livres'});
    for (let i = 0; i < (cfg.diasAFrente || 60); i++) {
      const iso = somarDias(hoje, i);
      if (!diaAtende(iso)) continue;
      const livres = horariosLivres(iso, ignorarId), dd = dataDe(iso), bloq = diaBloqueadoInteiro(iso);
      const bt = h('button', {type:'button', class:'dia-chip' + (iso === a.data ? ' sel' : '') + (bloq ? ' bloq' : !livres.length ? ' cheio' : ''), disabled: !livres.length && !encaixe,
        onclick:() => { a.data = iso; a.hora = ''; desenhar(); }},
        h('small', null, i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : DIAS_SEM[dd.getDay()]),
        h('b', null, String(dd.getDate()).padStart(2, '0') + '/' + String(dd.getMonth() + 1).padStart(2, '0')),
        h('small', null, bloq ? '🚫 sem atend.' : livres.length ? `${livres.length} livre${livres.length > 1 ? 's' : ''}` : 'lotado'));
      dias.appendChild(bt);
    }
    caixa.appendChild(dias);
    if (a.data) {
      const livres = horariosLivres(a.data, ignorarId);
      bloqueiosDoDia(a.data).forEach(b => caixa.appendChild(h('div', {class:'aviso-bloq'}, `🚫 ${b.diaInteiro === false ? `${b.horaIni} às ${b.horaFim}` : 'Dia todo'}: ${b.motivo || 'sem atendimento'}`)));
      caixa.appendChild(h('span', {style:'margin-top:12px'}, `🕘 Horários livres — ${DIAS_LONGO[dataDe(a.data).getDay()]}, ${fmtData(a.data)}`));
      if (encaixe) {
        const inp = h('input', {type:'time', value:a.hora || ''});
        inp.addEventListener('change', () => { a.hora = inp.value; a.horaFim = a.hora ? hmDe(minutos(a.hora) + (cfg.duracao || 30)) : ''; desenhar(); });
        caixa.appendChild(h('div', {class:'alerta', style:'margin-top:6px'}, ehAdmin() ? '⚠️ Encaixe: escolha qualquer horário, mesmo fora dos horários livres.' : '⏳ Pedido de encaixe: escolha o horário desejado e escreva o MOTIVO na observação. O agendamento fica aguardando a autorização da Kárita.', inp));
      } else {
        caixa.appendChild(h('div', {class:'horas-livres'}, livres.length ? livres.map(t => h('button', {type:'button', class:'hora-chip' + (t === a.hora ? ' sel' : ''),
          onclick:() => { a.hora = t; a.horaFim = hmDe(minutos(t) + (cfg.duracao || 30)); desenhar(); }}, t))
          : h('div', {class:'meta', style:'color:var(--cinza)'}, 'Nenhum horário livre neste dia. Escolha outro dia.')));
      }
    }
    if (a.data && a.hora) caixa.appendChild(h('div', {class:'aviso-ok', style:'margin-top:10px'}, `✅ ${DIAS_LONGO[dataDe(a.data).getDay()]}, ${fmtData(a.data)}, das ${a.hora} às ${a.horaFim}`));
    caixa.appendChild(h('label', {class:'ck', style:'margin-top:8px;padding:0;white-space:normal'},
      (() => { const c = h('input', {type:'checkbox', checked:encaixe}); c.addEventListener('change', () => { encaixe = c.checked; a.encaixe = encaixe; desenhar(); }); return c; })(),
      ehAdmin() ? 'Encaixe (fora dos horários livres)' : 'Pedir encaixe — precisa da autorização da Kárita'));
  };
  desenhar();
  return caixa;
}

/* =========================================================
   FALTAS SEM AVISO (registro automático na ficha)
   ========================================================= */
const ST_FALTA = 'Faltou (sem aviso)';
function fimAgendamentoMin(a){
  const dur = cfgAgenda().duracao || 30;
  return a.horaFim && minutos(a.horaFim) > minutos(a.hora) ? minutos(a.horaFim) : minutos(a.hora || '23:00') + dur;
}
function agendamentoVencido(a){
  if (a.status !== 'Agendado' || !a.data) return false;
  const hoje = hojeISO();
  if (a.data < hoje) return true;
  if (a.data > hoje || !a.hora) return false;
  const agora = new Date().getHours() * 60 + new Date().getMinutes();
  return agora > fimAgendamentoMin(a) + 120;
}
async function registrarFalta(a, auto){
  a.status = ST_FALTA;
  a.falta = {auto:!!auto, em:new Date().toISOString(), por: auto ? 'Sistema (automático)' : (estado.usuario ? estado.usuario.nome : '')};
  a.atualizadoEm = Date.now();
  await gravar('atendimentos', a);
  const p = pacientePorId(a.pacienteId);
  if (!p) return;
  p.faltas = Array.isArray(p.faltas) ? p.faltas : [];
  if (!p.faltas.some(f => f.atendimentoId === a.id)) {
    p.faltas.push({id:'falta-' + a.id, atendimentoId:a.id, data:a.data, hora:a.hora || '', tipo:a.tipo || '', numero:a.numero || '', auto:!!auto, registradoEm:new Date().toISOString(), por:a.falta.por});
    p.atualizadoEm = Date.now();
    await gravar('pacientes', p);
  }
}
async function desfazerFalta(atId){
  const a = estado.atendimentos.find(x => x.id === atId);
  if (a) { a.status = 'Concluído'; delete a.falta; a.atualizadoEm = Date.now(); await gravar('atendimentos', a); }
  const p = a ? pacientePorId(a.pacienteId) : estado.pacientes.find(x => (x.faltas || []).some(f => f.atendimentoId === atId));
  if (p && Array.isArray(p.faltas)) { p.faltas = p.faltas.filter(f => f.atendimentoId !== atId); p.atualizadoEm = Date.now(); await gravar('pacientes', p); }
  toast('Falta removida: marcado como compareceu');
}
let verificandoFaltas = false;
async function verificarFaltas(){
  if (!estado.usuario || verificandoFaltas) return;
  const venc = estado.atendimentos.filter(agendamentoVencido);
  if (!venc.length) return;
  verificandoFaltas = true;
  let n = 0;
  for (const a of venc) { try { await registrarFalta(a, true); n++; } catch (e) {} }
  verificandoFaltas = false;
  if (n) {
    toast(`📌 ${n} falta(s) sem aviso registrada(s) na ficha do paciente`);
    if (estado.tela !== 'form' && !document.querySelector('.modal-bg')) recarregar();
  }
}
setInterval(() => { if (estado.iniciado && !document.hidden && !document.body.classList.contains('bloqueado')) verificarFaltas(); }, 5 * 60000);
const qtdFaltas = p => (p && Array.isArray(p.faltas)) ? p.faltas.length : 0;

function alertaFaltas(p){
  const n = qtdFaltas(p); if (!n) return null;
  const ult = p.faltas.slice().sort((x, y) => (y.data || '').localeCompare(x.data || ''))[0];

async function revisarEncaixe(id){
  const a = estado.atendimentos.find(x => x.id === id); if (!a) return;
  const r = await modal('⏳ Pedido de encaixe', linhaPedidoEncaixe(a, false),
    [{texto:'Fechar', valor:null}, {texto:'❌ Recusar', valor:'nao', classe:'perigo'}, {texto:'✅ Autorizar', valor:'sim', classe:'rosa'}]);
  if (r === 'sim') decidirEncaixe(id, true); else if (r === 'nao') decidirEncaixe(id, false);
}
async function decidirEncaixe(id, autorizar){
  const a = estado.atendimentos.find(x => x.id === id); if (!a || !ehAdmin()) return;
  let motivo = '';
  if (!autorizar) {
    const fr = {m:''};
    const ok = await modal('❌ Recusar encaixe', h('div', null,
      h('p', {style:'margin-top:0'}, 'A secretária verá a recusa e o motivo. ' + ((a.encaixePedido || {}).anterior ? 'O agendamento volta para o horário anterior.' : 'O agendamento será cancelado.')),
      campo(fr, 'm', 'Motivo (opcional)', {cheio:true, dica:'Ex.: neste horário tenho outro compromisso'})),
      [{texto:'Voltar', valor:false}, {texto:'❌ Recusar', valor:true, classe:'perigo'}]);
    if (!ok) return;
    motivo = fr.m.trim();
  }
  const pd = a.encaixePedido || {};
  a.encaixeDecisao = {decisao: autorizar ? 'autorizado' : 'recusado', por:estado.usuario.nome, em:new Date().toISOString(), motivo};
  if (autorizar) a.status = 'Agendado';
  else if (pd.anterior) Object.assign(a, {data:pd.anterior.data, hora:pd.anterior.hora, horaFim:pd.anterior.horaFim, status:pd.anterior.status, obsAgenda:pd.anterior.obsAgenda || ''});
  else a.status = 'Cancelado';
  a.atualizadoEm = Date.now();
  await gravar('atendimentos', a);
  toast(autorizar ? '✅ Encaixe autorizado' : '❌ Encaixe recusado');
  recarregar();
}

/* =========================================================
   SECRETÁRIA SÓ ENTRA NO CONSULTÓRIO (localização)
   ========================================================= */
function obterLocalizacao(){
  return new Promise((res, rej) => {
    if (!navigator.geolocation) { rej(new Error('semgps')); return; }
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, precisao:Math.round(p.coords.accuracy || 0)}),
      e => rej(new Error(e.code === 1 ? 'negado' : 'semgps')),
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}
function distanciaM(a, b){
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
async function verificarConsultorio(){
  const c = estado.config.consultorio;
  if (!c || !c.ativo || typeof c.lat !== 'number') return {ok:true, semRegra:true};
  let pos;
  try { pos = await obterLocalizacao(); }
  catch (e) { return {ok:false, erro:e.message}; }
  const d = Math.round(distanciaM(pos, c)), raio = c.raio || 150;
  return {ok: d <= raio + Math.min(pos.precisao || 0, 100), distancia:d, precisao:pos.precisao, lat:pos.lat, lng:pos.lng, raio};
}
function textoErroLocal(v){
  if (v.erro === 'negado') return '📍 Para a secretária entrar, o celular precisa liberar a LOCALIZAÇÃO para este site. Toque no cadeado ao lado do endereço, permita "Localização" e tente de novo.';
  if (v.erro === 'semgps') return '📍 Não foi possível descobrir a localização. Ligue o GPS (localização) do aparelho e tente de novo.';
  return `📍 Você está a cerca de ${v.distancia >= 1000 ? (v.distancia / 1000).toFixed(1).replace('.', ',') + ' km' : v.distancia + ' m'} do consultório. O acesso da secretária só é liberado dentro do consultório.`;
}

function fotoExemplo(texto, cor1, cor2){
  try {
    const c = document.createElement('canvas'); c.width = 800; c.height = 600;
    const x = c.getContext('2d'); if (!x) return '';
    const g = x.createLinearGradient(0, 0, 800, 600); g.addColorStop(0, cor1); g.addColorStop(1, cor2);
    x.fillStyle = g; x.fillRect(0, 0, 800, 600);
    x.fillStyle = 'rgba(255,255,255,.9)'; x.font = 'bold 44px Georgia'; x.textAlign = 'center';
    x.fillText(texto, 400, 310);
    x.font = '24px sans-serif'; x.fillText('(imagem de exemplo)', 400, 360);
    return c.toDataURL('image/jpeg', 0.8);
  } catch (e) { return ''; }
}

async function apagarDadosTeste(){
  const nP = estado.pacientes.filter(p => p.teste).length, nA = estado.atendimentos.filter(a => a.teste).length, nF = estado.financeiro.filter(l => l.teste).length;
  if (!nP && !nA && !nF) { await aviso('Não há dados de teste no sistema.', 'Dados de teste'); return; }
  if (!await confirmar(`Apagar os dados fictícios de teste? Serão removidos ${nP} paciente(s), ${nA} atendimento(s) e ${nF} lançamento(s) financeiro(s) marcados como teste, e os laudos de teste do portal. Os dados que você cadastrou de verdade continuam.`, '🧹 Limpar dados de teste', 'Apagar dados de teste', true)) return;
  toast('Limpando dados de teste...');
  const idsTeste = new Set(estado.pacientes.filter(p => p.teste).map(p => p.id));
  /* tira do portal os laudos de teste */
  for (const a of estado.atendimentos) {
    if ((a.teste || idsTeste.has(a.pacienteId)) && a.portal && a.portal.docId) { try { await portalApagarDoc(PORTAL_COL_LAUDO, a.portal.docId); } catch (e) {} }
  }
  for (const p of estado.pacientes) if (p.teste && p.portalIndiceId) { try { await portalApagarDoc(PORTAL_COL_IDX, p.portalIndiceId); } catch (e) {} }
  /* apaga do aparelho */
  for (const a of estado.atendimentos) if (a.teste || idsTeste.has(a.pacienteId)) await apagar('atendimentos', a.id);
  for (const l of estado.financeiro) if (l.teste || idsTeste.has(l.pacienteId)) await apagar('financeiro', l.id);
  for (const p of estado.pacientes) if (p.teste) await apagar('pacientes', p.id);
  for (const u of (estado.usuarios || [])) if (u.teste) await apagar('usuarios', u.id);
  for (const r of (estado.ponto || [])) if (r.teste) await apagar('ponto', r.id);
  for (const b of (estado.bloqueios || [])) if (b.teste) await apagar('bloqueios', b.id);
  /* acerta a numeração para continuar do último relatório e recibo de verdade */
  const restantesAt = estado.atendimentos.filter(a => !(a.teste || idsTeste.has(a.pacienteId)));
  const restantesFin = estado.financeiro.filter(l => !(l.teste || idsTeste.has(l.pacienteId)));
  estado.config.contador = restantesAt.reduce((m, a) => Math.max(m, parseInt(a.numero, 10) || 0), 0);
  estado.config.contadorRecibo = restantesFin.reduce((m, l) => Math.max(m, parseInt(l.reciboNum, 10) || 0), 0);
  estado.config.testeRemovido = true;
  await salvarConfig();
  if (portalModo() === 'teste') { try { localStorage.removeItem('kt_portal_teste'); } catch (e) {} }
  try { localStorage.setItem('kt_sem_demonstracao', '1'); } catch (e) {}
  await carregar();
  limparVideosSoltos();
  for (const id of new Set(estado.atendimentos.filter(a => a.portal && a.portal.liberado).map(a => a.pacienteId))) { try { await publicarPaciente(id); } catch (e) {} }
  toast('Dados de teste apagados');
  ir('inicio');
  aviso('Pronto! Os dados fictícios foram apagados deste painel. Neste aparelho, o site também deixou de mostrar os pacientes de demonstração. Para tirá-los do site publicado, vá em ⚙️ Ajustes › Portal do paciente e toque em "Baixar site configurado", e envie o novo index.html ao Netlify.', 'Limpeza concluída');
}

async function fazerLogin(login, senha){
  login = String(login || '').trim();
  if (!login || !senha) throw new Error('vazio');
  if (emNuvem()) {
    const email = emailDoLogin(login);
    let j;
    try { j = await chamarAuth('signInWithPassword', {email, password:senha, returnSecureToken:true}); }
    catch (e) { throw new Error(/INVALID|NOT_FOUND|PASSWORD|DISABLED/.test(e.message) ? 'credenciais' : /TOO_MANY/.test(e.message) ? 'muitas' : 'rede'); }
    sessaoNuvem = {uid:j.localId, email, idToken:j.idToken, refreshToken:j.refreshToken, expira:Date.now() + (parseInt(j.expiresIn, 10) - 120) * 1000};
    if (email === NUVEM.adminEmail.toLowerCase()) sessaoNuvem.usuario = {uid:j.localId, nome:'Kárita', login:email, papel:'admin'};
    else {
      let d = null;
      try { const u = await nuvemGet(COLECOES.usuarios, j.localId); d = u ? Object.assign(doJson(u), {ativo:u.ativo}) : null; } catch (e) {}
      if (!d || d.ativo === false) { sessaoNuvem = null; guardarSessaoNuvem(); throw new Error('inativo'); }
      sessaoNuvem.usuario = {uid:j.localId, nome:d.nome, login:d.login, papel:'secretaria'};
    }
    guardarSessaoNuvem();
    return sessaoNuvem.usuario;
  }
  const l = login.toLowerCase();
  if (l === loginAdminLocal()) {
    if (resumoSenha(senha) !== hashAtual()) throw new Error('credenciais');
    return {uid:'admin', nome:'Kárita', login:l, papel:'admin'};
  }
  const u = (estado.usuarios || []).find(x => (x.login || '').toLowerCase() === l);
  if (!u || u.senhaHash !== resumoSenha(senha)) throw new Error('credenciais');
  if (u.ativo === false) throw new Error('inativo');
  return {uid:u.id, nome:u.nome, login:u.login, papel:'secretaria'};
}
function guardarSessaoLocal(u){
  if (emNuvem()) return;
  const chk = u.papel === 'admin' ? hashAtual() : ((estado.usuarios || []).find(x => x.id === u.uid) || {}).senhaHash;
  try { sessionStorage.setItem('kt_sessao', JSON.stringify(Object.assign({}, u, {chk}))); } catch (e) {}
}
function restaurarSessao(){
  if (emNuvem()) return sessaoNuvem && sessaoNuvem.usuario ? sessaoNuvem.usuario : null;
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem('kt_sessao') || 'null'); } catch (e) {}
  if (!s || typeof s !== 'object' || !s.uid) return null;
  if (s.papel === 'admin') return s.chk === hashAtual() ? s : null;
  const u = (estado.usuarios || []).find(x => x.id === s.uid);
  return (u && u.ativo !== false && u.senhaHash === s.chk) ? s : null;
}

      if (!a.encaixe && !horariosLivres(a.data, a.id).includes(a.hora) && !(orig && orig.data === a.data && orig.hora === a.hora)) { toast('Esse horário acabou de ser ocupado. Escolha outro.'); return false; }

      h('button', {class:'btn ouro', onclick:() => { estado.pontoFiltro = {mes:hojeISO().slice(0, 7), uid:u.uid}; ir('ponto'); }}, '🕐 Meu ponto'),
      h('button', {class:'btn', onclick:sairDoPainel}, '🚪 Sair e registrar saída')));
}

/* ----- trabalho em equipe na nuvem (configuração, só a Kárita) ----- */
function regrasNuvem(email){
  email = email || 'EMAIL_DA_KARITA';
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function logado() { return request.auth != null; }
    function admin() { return logado() && request.auth.token.email == '${email}'; }
    function equipe() {
      return admin() || (logado() && exists(/databases/$(database)/documents/karita_usuarios/$(request.auth.uid))
        && get(/databases/$(database)/documents/karita_usuarios/$(request.auth.uid)).data.ativo == true);
    }
    match /karita_usuarios/{id} { allow read: if admin() || (logado() && request.auth.uid == id); allow write: if admin(); }
    match /karita_config/{id} { allow read: if equipe(); allow write: if admin(); }
    match /karita_contadores/{id} { allow read, write: if equipe(); }
    match /karita_publico/{id} { allow read: if true; allow write: if admin(); }
    match /karita_bloqueios/{id} { allow read, write: if equipe(); }
    match /karita_pacientes/{id} { allow read, create, update: if equipe(); allow delete: if admin(); }
    match /karita_agenda/{id} { allow read, create, update: if equipe(); allow delete: if admin(); }
    match /karita_prontuario/{id} { allow read, write: if admin(); }
    match /karita_financeiro/{id} {
      allow read: if admin() || (equipe() && resource.data.tipo == 'receita');
      allow create: if admin() || (equipe() && request.resource.data.tipo == 'receita');
      allow update: if admin() || (equipe() && resource.data.tipo == 'receita' && request.resource.data.tipo == 'receita');
      allow delete: if admin();
    }
    match /karita_arquivos/{id} {
      allow read: if admin() || (equipe() && resource.data.nivel == 'equipe');
      allow create, update: if admin() || (equipe() && request.resource.data.nivel == 'equipe');
      allow delete: if admin();
    }
    match /karita_ponto/{id} {
      allow read: if admin() || (logado() && resource.data.uid == request.auth.uid);
      allow create: if equipe() && request.resource.data.uid == request.auth.uid;
      allow update: if admin() || (equipe() && resource.data.uid == request.auth.uid && resource.data.saida == '');
      allow delete: if admin();
    }
    match /${PORTAL_COL_LAUDO}/{id} {
      allow get: if resource.data.validade > request.time;
      allow list: if false;
      allow create, update, delete: if admin();
    }
    match /${PORTAL_COL_IDX}/{id} {
      allow get: if resource.data.validade > request.time;
      allow list: if false;
      allow create, update, delete: if admin();
    }
  }
}`;
}
async function baixarPainelConfigurado(cfg){
  let txt;
  try { const r = await fetch('relatorio-atendimento.html', {cache:'no-store'}); if (!r.ok) throw 0; txt = await r.text(); }
  catch (e) { await aviso('Para baixar o painel configurado, abra o painel pelo endereço do site (Netlify), e não pelo arquivo no aparelho.', 'Baixar painel'); return; }
  const limpo = s => String(s || '').replace(/['\\]/g, '').trim();
  if (!/const NUVEM = \{[^}]*\};/.test(txt)) { await aviso('Não encontrei o painel original.', 'Baixar painel'); return; }
  txt = txt.replace(/const NUVEM = \{[^}]*\};/, `const NUVEM = {projectId:'${limpo(cfg.projectId)}', apiKey:'${limpo(cfg.apiKey)}', adminEmail:'${limpo(cfg.adminEmail).toLowerCase()}'};`);
  const a = h('a', {href:URL.createObjectURL(new Blob([txt], {type:'text/html'})), download:'relatorio-atendimento.html'});
  document.body.appendChild(a); a.click(); a.remove();
  toast('Painel configurado baixado');
}
function cartaoNuvem(){
  if (emNuvem()) {
    return h('div', {class:'cartao'}, h('h2', null, '☁️ Trabalho em equipe (nuvem)'),
      h('div', {class:'aviso-ok', style:'margin-bottom:12px'}, `✅ Ligado à nuvem (projeto ${NUVEM.projectId}). A Kárita e as secretárias veem os mesmos dados, cada uma no seu aparelho.`),
      h('p', {style:'margin:0 0 10px;font-size:14px;color:var(--cinza)'}, 'Se você usava o sistema antes neste mesmo navegador (modo local), pode enviar aqueles dados para a nuvem. Vídeos continuam só no aparelho onde foram gravados.'),
      h('div', {class:'acoes', style:'margin-top:0'}, h('button', {class:'btn ouro', onclick:enviarLocalParaNuvem}, '⬆️ Enviar dados deste aparelho para a nuvem')));
  }
  const c = estado.config.nuvemPlano || (estado.config.nuvemPlano = {});
  const pc = estado.config.portal || {};
  const f = {projectId:c.projectId || pc.projectId || '', apiKey:c.apiKey || pc.apiKey || '', adminEmail:c.adminEmail || pc.email || ''};
  const txtRegras = h('textarea', {rows:12, readonly:true, style:'font-family:monospace;font-size:11.5px;margin-top:8px'});
  const atualizarRegras = () => { txtRegras.value = regrasNuvem(f.adminEmail.trim().toLowerCase()); };
  atualizarRegras();
  const salvarPlano = async () => { Object.assign(c, {projectId:f.projectId.trim(), apiKey:f.apiKey.trim(), adminEmail:f.adminEmail.trim().toLowerCase()}); estado.config.portal = Object.assign(estado.config.portal || {}, {projectId:c.projectId, apiKey:c.apiKey}); await salvarConfig(); };
  return h('div', {class:'cartao'}, h('h2', null, '☁️ Trabalho em equipe (nuvem)'),
    h('div', {class:'alerta', style:'margin:0 0 12px'}, '📱 Modo local: os dados ficam só neste aparelho. Uma secretária só consegue usar neste mesmo aparelho. Para cada uma trabalhar no seu, ligue a nuvem (Firebase).'),
    h('ol', {style:'margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.7'},
      h('li', null, 'No Firebase: crie o projeto, ative o Firestore e, em Authentication, o login por E-mail/senha, com o usuário da Kárita.'),
      h('li', null, 'Preencha abaixo e copie as regras para o Firestore › Regras › Publicar.'),
      h('li', null, 'Baixe o painel e o site configurados e envie os dois ao GitHub ou Netlify.'),
      h('li', null, 'Abra o site, entre com o e-mail e a senha da Kárita no Firebase e cadastre as secretárias em Ajustes.')),
    h('div', {class:'grade'},
      campo(f, 'projectId', 'ID do projeto Firebase'),
      campo(f, 'apiKey', 'Chave da web (Web API Key)'),
      campo(f, 'adminEmail', 'E-mail da Kárita no Firebase', {tipo:'email', cheio:true, aoMudar:atualizarRegras})),
    h('div', {class:'acoes'},
      h('button', {class:'btn rosa', onclick: async () => {
        if (!f.projectId.trim() || !f.apiKey.trim() || !/@/.test(f.adminEmail)) { await aviso('Preencha o ID do projeto, a chave da web e o e-mail da Kárita.', 'Nuvem'); return; }
        await salvarPlano(); await baixarPainelConfigurado(c);
      }}, '⬇️ Baixar painel configurado'),
      h('button', {class:'btn ouro', onclick: async () => {
        if (!f.projectId.trim() || !f.apiKey.trim()) { await aviso('Preencha o ID do projeto e a chave da web.', 'Nuvem'); return; }
        await salvarPlano(); await baixarSiteConfigurado();
      }}, '⬇️ Baixar site configurado')),
    h('details', {style:'margin-top:12px'},
      h('summary', {style:'cursor:pointer;font-weight:600;color:var(--rosa-esc)'}, 'Regras de segurança (copiar e colar no Firestore › Regras)'),
      txtRegras,
      h('button', {class:'btn peq', style:'margin-top:6px', onclick: async () => { atualizarRegras(); try { await navigator.clipboard.writeText(txtRegras.value); toast('Regras copiadas'); } catch (e) { txtRegras.select(); } }}, '📋 Copiar regras')));
}
async function enviarLocalParaNuvem(){
  let locais;
  try { locais = {pacientes:await idbLerTodos('pacientes'), atendimentos:await idbLerTodos('atendimentos'), financeiro:await idbLerTodos('financeiro')}; }
  catch (e) { await aviso('Não encontrei dados locais neste aparelho.', 'Nuvem'); return; }
  const total = locais.pacientes.length + locais.atendimentos.length + locais.financeiro.length;
  if (!total) { await aviso('Não há dados guardados só neste aparelho.', 'Nuvem'); return; }
  if (!await confirmar(`Enviar para a nuvem ${locais.pacientes.length} paciente(s), ${locais.atendimentos.length} atendimento(s) e ${locais.financeiro.length} lançamento(s) que estão neste aparelho? Registros com o mesmo código serão atualizados.`, 'Enviar para a nuvem', 'Enviar')) return;
  let n = 0;
  try {
    for (const st of ['pacientes', 'atendimentos', 'financeiro']) for (const o of locais[st]) {
      (o.docs || []).concat(o.fotos || [], o.comprovantes || []).forEach(f => { delete f.enviado; });
      await gravar(st, o); n++;
      if (n % 5 === 0) toast(`Enviando... ${n} de ${total}`);
    }
  } catch (e) { await aviso(`Parou no item ${n + 1} de ${total}: verifique a internet e tente de novo. O que já foi enviado continua na nuvem.`, 'Nuvem'); }
  await carregar(); toast(`${n} registro(s) enviados para a nuvem`); ir('inicio');
}

/* ----- início do sistema ----- */
async function iniciarApp(novoLogin){
  estado.iniciado = true;
  if (emNuvem()) {
    try { toast('Carregando dados da nuvem...'); await carregar(); }
    catch (e) {
      estado.iniciado = false; sessaoNuvem = null; guardarSessaoNuvem();
      telaBloqueio(e.message === 'permissao' ? 'Seu acesso não tem permissão. Fale com a Kárita.' : 'Não foi possível carregar os dados. Verifique a internet e entre de novo.');
      return;
    }
  }
  atualizarTopo(); atualizarChipUsuario();
  if (estado.usuario.papel === 'secretaria') {
    let pontoAtual = null; try { pontoAtual = sessionStorage.getItem('kt_ponto'); } catch (e) {}
    if (novoLogin || !pontoAtual) { try { await registrarEntrada(); } catch (e) { toast('⚠️ Não foi possível registrar a entrada do ponto'); } }
    if (estado.agenda) estado.agenda.data = hojeISO();
  }
  ir('inicio');
  setTimeout(verificarFaltas, 1500);
  if (ehAdmin()) {
    if (!emNuvem() && !estado.pacientes.length && !estado.atendimentos.length && !estado.config.testeRemovido && !estado.config.exemploCarregado) {
      try { await carregarExemplo(true); toast('Sistema aberto com dados fictícios para teste'); } catch (e) {}
    }
    limparVideosSoltos();
    revisarPortalVencidos();
  } else {
    let id = null; try { id = sessionStorage.getItem('kt_ponto'); } catch (e) {}
    const abertos = (estado.ponto || []).filter(p => p.uid === estado.usuario.uid && !p.saida && p.id !== id);
    if (abertos.length) aviso(`Você não registrou a saída em: ${abertos.map(p => fmtData(p.data)).join(', ')}. Avise a Kárita para ajustar o ponto. Lembre-se de sair sempre pelo botão 🚪.`, 'Ponto');
  }
}
function assinaturaDados(){
  return JSON.stringify([estado.pacientes, estado.atendimentos, estado.financeiro].map(l => l.map(o => o.id + ':' + (o.atualizadoEm || '') + ':' + JSON.stringify(o.parcelas || '').length + ':' + (o.status || ''))));
}
setInterval(async () => {
  if (!emNuvem() || !estado.iniciado || !estado.usuario || document.hidden || document.body.classList.contains('bloqueado')) return;
  if (estado.tela === 'form' || document.querySelector('.modal-bg') || $('#relatorioTela') || document.querySelector('.vz-fundo')) return;
  const antes = assinaturaDados();
  try { await carregar(); } catch (e) { return; }
  if (assinaturaDados() !== antes) { ir(estado.tela); toast('🔄 Dados atualizados'); }
}, 40000);
window.addEventListener('unhandledrejection', e => {
  const m = e.reason && e.reason.message;
  if (m === 'permissao') toast('⛔ Sem permissão para esta ação');
  else if (m === 'rede' || m === 'sessao') toast('⚠️ Sem conexão com a nuvem. Verifique a internet.');
});

if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
(async function iniciar(){
  try {
    await abrirDB();
    await carregar();
  } catch (e) {
    document.body.classList.remove('bloqueado');
    $('#conteudo').appendChild(h('div', {class:'cartao'}, h('h2', null, 'Erro'), 'Este navegador não permitiu guardar dados. Abra o arquivo no Chrome ou no Safari, fora do modo anônimo.'));
    return;
  }
  atualizarTopo();
  $('#versaoApp').textContent = 'Versão ' + VERSAO;
  $('#btnAjustes').addEventListener('click', () => ir('config'));
  $('#btnSair').addEventListener('click', sairDoPainel);
  try { sessionStorage.removeItem('kt_tentativa'); } catch (e) {}
  const u = restaurarSessao();
  if (u) { estado.usuario = u; liberarAcesso(); iniciarApp(false); }
  else telaBloqueio('');
})();
